<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>दुकान अपडेट करें</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap">
<style>
:root{
  --ink:#1d2420; --muted:#6b7a70; --line:#dfe6e1; --paper:#f5f8f6; --card:#fff;
  --leaf:#1b7a3e; --leaf-d:#125c2d; --leaf-l:#e6f3ea;
  --plum:#5c1c3d; --warn:#b3261e; --warn-l:#fdecea; --amber:#8a5a00; --amber-l:#fff6e0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.6; padding-bottom:96px; -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;line-height:1.25}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

header{background:var(--plum);color:#fff;padding:18px 14px}
header .in{max-width:640px;margin:0 auto}
.hdr-row{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.langbtn{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:11px;cursor:pointer;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;
  font-family:inherit;font-size:14px;font-weight:700}
.langbtn:active{background:rgba(255,255,255,.28)}
header h1{font-size:21px;font-weight:800}
header p{margin:4px 0 0;opacity:.85;font-size:13.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.card h2{font-size:17px;font-weight:700;margin-bottom:4px}
.hint{font-size:13.5px;color:var(--muted);margin:4px 0 0}

label{display:block;margin-top:12px}
label>span{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
input,select,textarea{
  font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
  border-radius:11px;background:#fff;color:var(--ink);width:100%
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);border-color:transparent}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;padding:10px 14px;border:0;border-radius:14px;
  font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none
}
.btn-go{background:var(--leaf);color:#fff}
.btn-go:active{background:var(--leaf-d)}
.btn-go[disabled]{background:#a9c4b3;cursor:default}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-sm{min-height:44px;font-size:14px;width:auto;padding:0 14px}

.note{border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.6;margin-top:12px}
.note-amber{background:var(--amber-l);color:var(--amber)}
.note-warn{background:var(--warn-l);color:var(--warn)}
.note-leaf{background:var(--leaf-l);color:var(--leaf-d)}

/* Five tabs no longer fit a 360px phone if they each demand equal width, so
   the row scrolls sideways instead of pushing the whole page wide. */
.tabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;min-height:46px;padding:0 15px;border:1px solid var(--line);background:#fff;border-radius:12px;
  font-family:inherit;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap
}
.tabs button[aria-selected="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}

.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.thumb{
  width:54px;height:54px;flex:0 0 auto;border-radius:12px;background:var(--leaf-l);
  display:grid;place-items:center;font-size:24px;overflow:hidden;position:relative
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:16px;font-weight:700}
.row .nm small{display:block;color:var(--muted);font-size:12.5px}
.row .price{width:84px;text-align:right}
.row .unit{width:104px}

.rowacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{
  min-height:40px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px
}
.chip[aria-pressed="true"]{background:var(--leaf-l);border-color:var(--leaf);color:var(--leaf-d)}
.chip.danger{color:var(--warn);border-color:#f2c9c5}
.item{border-bottom:1px solid var(--line);padding:12px 0}
.item:last-child{border-bottom:0}
.item.out{opacity:.55}

/* ---------- inline editor ---------- */
.edit{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfc}
.edit label{margin-top:10px}
.edit label:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{margin-top:0}
.picks{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.pick{min-height:40px;padding:0 13px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.help{font-size:12.5px;color:var(--muted);margin:5px 0 0;line-height:1.5}
.help.bad{color:#a4302a;font-weight:700}
.nocost{display:block;margin-top:3px;font-weight:600;opacity:.75}
.sellttl{font-size:14.5px;font-weight:800;margin-bottom:4px}
.srcline{margin:8px 0 0;font-size:12.5px;color:var(--muted);font-weight:600}
.stocktot{margin:6px 0 2px;padding:10px 12px;border-radius:11px;background:var(--leaf-l);
  color:var(--leaf-d);font-size:14px;font-weight:700;line-height:1.5}
.bar{display:flex;align-items:center;gap:9px;padding:7px 0}
.bar .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{flex:0 0 96px;height:9px;border-radius:99px;background:var(--line);overflow:hidden}
/* display:block matters, because an inline span ignores width and every bar drew empty */
.bar .fill{display:block;height:100%;background:var(--leaf);border-radius:99px}
.bar .val{flex:0 0 auto;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.dead{font-size:14px;line-height:1.7}
.dead b{font-weight:700}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.kpi div{background:var(--leaf-l);border-radius:12px;padding:11px 12px}
.kpi b{display:block;font-size:19px;font-weight:800;color:var(--leaf-d);line-height:1.25}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}

.stars{color:#c78100;font-size:16px;letter-spacing:2px}
.badge{display:inline-block;background:var(--leaf-l);color:var(--leaf-d);border-radius:999px;
  padding:1px 9px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:2px}
.rev-meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.rev-text{margin:6px 0 0;font-size:15px}

.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(20,60,35,.10)
}
.savebar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .status{flex:1;font-size:13.5px;color:var(--muted);line-height:1.4}
.savebar .btn{flex:0 0 auto;width:auto;padding:0 22px}

.hidden{display:none!important}
ol.steps{padding-left:20px;margin:10px 0 0;font-size:14.5px;line-height:1.75}
ol.steps li{margin-bottom:7px}
code{background:var(--leaf-l);color:var(--leaf-d);padding:2px 6px;border-radius:6px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
a{color:var(--leaf-d)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<header><div class="in">
  <div class="hdr-row">
    <div>
      <h1 data-tx="title"></h1>
      <p data-tx="subtitle"></p>
    </div>
    <button class="langbtn" id="langBtn" type="button"></button>
  </div>
</div></header>

<div class="wrap">

  <!-- ============================ LOGIN ============================ -->
  <section id="login">
    <div class="card">
      <h2 data-tx="loginH"></h2>
      <p class="hint" data-tx="loginHint"></p>

      <label>
        <span data-tx="tokLbl"></span>
        <input id="tok" type="password" autocomplete="off" placeholder="github_pat_...">
      </label>
      <button class="btn btn-go" id="doLogin" style="margin-top:14px" data-tx="open"></button>
      <p class="note note-warn hidden" id="loginErr"></p>

      <details style="margin-top:16px">
        <summary style="font-weight:700;cursor:pointer" data-tx="howTok"></summary>
        <ol class="steps">
          <li data-txhtml="step1"></li>
          <li data-txhtml="step2"></li>
          <li data-txhtml="step3"></li>
          <li data-txhtml="step4"></li>
          <li data-txhtml="step5"></li>
        </ol>
        <p class="note note-amber" data-tx="tokNote"></p>
      </details>
    </div>
  </section>

  <!-- ============================ EDITOR =========================== -->
  <section id="editor" class="hidden">

    <div class="tabs" role="tablist">
      <button id="tabVeg" role="tab" aria-selected="true" data-tx="tabVeg"></button>
      <button id="tabGar" role="tab" aria-selected="false" data-tx="tabGar"></button>
      <button id="tabRev" role="tab" aria-selected="false" data-tx="tabRev"></button>
      <button id="tabAna" role="tab" aria-selected="false" data-tx="tabAna"></button>
      <button id="tabSet" role="tab" aria-selected="false" data-tx="tabSet"></button>
    </div>

    <!-- ---- vegetables ---- -->
    <div id="paneVeg">
      <div class="card">
        <h2 data-tx="vegH"></h2>
        <p class="hint" data-tx="vegHint"></p>
        <p class="stocktot" id="vegTotal"></p>
        <div class="picks" id="vegFilter" style="margin-bottom:4px"></div>
        <div id="vegList"></div>
        <button class="btn btn-ghost" id="addVeg" style="margin-top:12px" data-tx="addVeg"></button>
      </div>
    </div>

    <!-- ---- garments ---- -->
    <div id="paneGar" class="hidden">
      <div class="card">
        <h2 data-tx="garH"></h2>
        <p class="hint" data-tx="garHint"></p>
        <p class="stocktot" id="garTotal"></p>
        <div id="garList"></div>
        <button class="btn btn-ghost" id="addGar" style="margin-top:12px" data-tx="addGar"></button>
      </div>
    </div>

    <!-- ---- reviews ---- -->
    <div id="paneRev" class="hidden">
      <div class="card">
        <h2 data-tx="revH"></h2>
        <p class="hint" data-tx="revHint"></p>

        <label>
          <span data-tx="revUrlLbl"></span>
          <input id="revUrl" type="url" autocomplete="off" inputmode="url" placeholder="https://reviews.xxxx.workers.dev">
        </label>
        <label>
          <span data-tx="revKeyLbl"></span>
          <input id="revKey" type="password" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        </label>
        <p class="hint" data-txhtml="revNote"></p>

        <button class="btn btn-ghost" id="revLoad" style="margin-top:12px" data-tx="revLoad"></button>
        <p class="note note-warn hidden" id="revErr"></p>
      </div>

      <div class="card hidden" id="revCard">
        <h2><span data-tx="revAll"></span> <span class="hint" id="revCount" style="display:inline;font-weight:400"></span></h2>
        <div id="revList"></div>
      </div>
    </div>

    <!-- ---- analytics ---- -->
    <div id="paneAna" class="hidden">
      <div class="card">
        <h2 data-tx="anaH"></h2>
        <p class="note note-amber" data-tx="anaWarn"></p>
        <div class="picks" id="anaRange"></div>
        <button class="btn btn-ghost" id="anaLoad" style="margin-top:12px" data-tx="anaLoad"></button>
        <p class="note note-warn hidden" id="anaErr"></p>
      </div>
      <div id="anaOut"></div>
    </div>

    <!-- ---- settings ---- -->
    <div id="paneSet" class="hidden">
      <div class="card">
        <h2 data-tx="setH"></h2>
        <label><span data-tx="setOpenL"></span><input id="setOpen" type="time"></label>
        <label><span data-tx="setCloseL"></span><input id="setClose" type="time"></label>
        <label><span data-tx="setLastL"></span><input id="setLast" type="time"></label>
        <label><span data-tx="setMinL"></span><input id="setMin" type="number" min="0" step="10" inputmode="numeric"></label>
        <label><span data-tx="setHoursL"></span><input id="setHours" type="number" min="1" step="1" inputmode="numeric"></label>
        <label><span>UPI ID</span><input id="setUpi" type="text" autocomplete="off"></label>
        <p class="note note-amber" data-tx="setNote"></p>
      </div>
      <div class="card">
        <h2 data-tx="waH"></h2>
        <p class="hint" data-tx="waHint"></p>
        <textarea id="waList" rows="12" readonly style="margin-top:10px;font-size:14px"></textarea>
        <button class="btn btn-ghost" id="copyWa" style="margin-top:10px" data-tx="copyWa"></button>
        <button class="btn btn-ghost" id="waPic" style="margin-top:8px" data-tx="waPic"></button>
        <p class="help" data-tx="waPicHint"></p>
        <div id="waPicOut" class="hidden" style="margin-top:10px">
          <img id="waPicImg" alt="" style="width:100%;border-radius:12px;border:1.5px solid var(--line)">
          <a id="waPicDl" class="btn btn-ghost" style="margin-top:8px;text-align:center;text-decoration:none"
             download="rate-list.png" data-tx="waPicSave"></a>
        </div>
      </div>
      <div class="card">
        <h2 data-tx="outH"></h2>
        <p class="hint" data-tx="outHint"></p>
        <button class="btn btn-ghost" id="logout" style="margin-top:10px;color:var(--warn)" data-tx="logout"></button>
      </div>
    </div>

  </section>
</div>

<div class="savebar hidden" id="savebar"><div class="in">
  <span class="status" id="status"></span>
  <button class="btn btn-go" id="save" data-tx="save"></button>
</div></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------------
     Two languages, English first. Tarun types faster in English, but the
     Hindi is here because reading a form in your own language is a
     different thing from typing in it.

    revNoneShort:['· no reviews yet', '· अभी कोई राय नहीं'],
    revStat:    ['· {n} reviews, average {a} ★', '· {n} राय, औसत {a} ★'],
    revOnTop:   ['on the website', 'वेबसाइट पर ऊपर'],
    revNoName:  ['No name', 'बिना नाम'],
    revFeature: ['Show at top', 'ऊपर दिखाएँ'],

  function tx(key, vars) {
    var row = TX[key];
    var out = row ? (row[alang] || row[0]) : key;
    return vars ? out.replace(/\{(\w+)\}/g, function (_, k) {
      return vars[k] === undefined ? '' : vars[k];
    }) : out;
  }

  function paintUI() {
    document.documentElement.lang = alang ? 'hi' : 'en';
    var n;
    n = document.querySelectorAll('[data-tx]');
    for (var i = 0; i < n.length; i++) n[i].textContent = tx(n[i].getAttribute('data-tx'));
    n = document.querySelectorAll('[data-txhtml]');
    for (var j = 0; j < n.length; j++) n[j].innerHTML = tx(n[j].getAttribute('data-txhtml'));
    $('langBtn').textContent = tx('langName');
  }

  var OWNER = 'sandeepprasadR';
  var REPO  = 'sabzi';
  var BRANCH = 'main';
  var TOK_KEY = 'gavs.admin.token.v1';
  var API = 'https://api.github.com';

  var token = '';
  var files = {};          /* path -> { sha, text, data, dirty } */
  var pendingPhotos = [];  /* { path, b64 } committed alongside */

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------------- base64 that survives Hindi ---------------------- */
  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decode(b64) {
    var bin = atob(b64.replace(/\s/g, '')), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  /* ------------------------------ GitHub --------------------------------- */
  function gh(path, opts) {
    opts = opts || {};
    return fetch(API + path, {
      method: opts.method || 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error('AUTH');
      if (!r.ok) return r.text().then(function (t) { throw new Error(r.status + ' ' + t.slice(0, 160)); });
      return r.json();
    });
  }

  function loadFile(path) {
    return gh('/repos/' + OWNER + '/' + REPO + '/contents/' + path + '?ref=' + BRANCH)
      .then(function (j) {
        var text = b64decode(j.content);
        var m = text.match(/\/\*<CATALOGUE>\*\/([\s\S]*?)\/\*<\/CATALOGUE>\*\//);
        if (!m) throw new Error(path + tx('noMarker'));
        files[path] = { sha: j.sha, text: text, data: JSON.parse(m[1]), dirty: false };
      });
  }

  /* strip our own scratch fields (anything starting with _) so previews and
     other in-memory state never get written into the published file */
  function clean(v) {
    if (Array.isArray(v)) return v.map(clean);
    if (v && typeof v === 'object') {
      var o = {};
      Object.keys(v).forEach(function (k) { if (k.charAt(0) !== '_') o[k] = clean(v[k]); });
      return o;
    }
    return v;
  }

  function saveFile(path) {
    var f = files[path];
    var json = JSON.stringify(clean(f.data), null, 2);
    json = json.split('\n').map(function (l, i) { return i ? '  ' + l : l; }).join('\n');
    var out = f.text.replace(/(\/\*<CATALOGUE>\*\/)[\s\S]*?(\/\*<\/CATALOGUE>\*\/)/, function (_, a, b) {
      return a + json + b;
    });
    return gh('/repos/' + OWNER + '/' + REPO + '/contents/' + path, {
      method: 'PUT',
      body: { message: 'Update ' + path + ' from shop admin', content: b64encode(out), sha: f.sha, branch: BRANCH }
    }).then(function (j) { f.sha = j.content.sha; f.text = out; f.dirty = false; });
  }

  function savePhoto(ph) {
    var body = { message: 'Add photo ' + ph.path, content: ph.b64, branch: BRANCH };
    return gh('/repos/' + OWNER + '/' + REPO + '/contents/' + ph.path + '?ref=' + BRANCH)
      .then(function (j) { body.sha = j.sha; }, function () { /* new file */ })
      .then(function () {
        return gh('/repos/' + OWNER + '/' + REPO + '/contents/' + ph.path, { method: 'PUT', body: body });
      });
  }

  /* ------------------------------ photos --------------------------------- */
  function pickPhoto(cb) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', function () {
      var file = inp.files && inp.files[0];
      if (!file) return;
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var MAX = 640;
        var w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        cb(cv.toDataURL('image/jpeg', 0.75).split(',')[1]);
      };
      img.onerror = function () { URL.revokeObjectURL(url); alert(tx('badPhoto')); };
      img.src = url;
    });
    inp.click();
  }

  function attachPhoto(item, path, redraw) {
    pickPhoto(function (b64) {
      var p = 'photos/' + path;
      pendingPhotos = pendingPhotos.filter(function (x) { return x.path !== p; });
      pendingPhotos.push({ path: p, b64: b64 });
      item.photo = p;
      item._preview = 'data:image/jpeg;base64,' + b64;
      markDirty(); redraw();
    });
  }

  /* ------------------------------- state --------------------------------- */
  function markDirty() {
    Object.keys(files).forEach(function (k) { files[k].dirty = true; });
    setStatus(tx('unsaved'));
    $('save').disabled = false;
  }
  function setStatus(msg, spin) {
    $('status').innerHTML = spin ? '<span class="spin"></span> ' + msg : msg;
  }

  /* ------------------------------ rendering ------------------------------ */
  /* ------------------------- shared field builders ----------------------- */
  function fieldText(labelTxt, value, onInput, opts) {
    opts = opts || {};
    var l = document.createElement('label');
    var sp = document.createElement('span'); sp.textContent = labelTxt;
    var i = document.createElement(opts.area ? 'textarea' : 'input');
    if (opts.area) i.rows = opts.rows || 3; else i.type = opts.type || 'text';
    if (opts.numeric) { i.inputMode = 'numeric'; i.min = '0'; i.step = opts.step || '1'; }
    if (opts.placeholder) i.placeholder = opts.placeholder;
    i.value = value == null ? '' : value;
    i.addEventListener('input', function () { onInput(i.value); markDirty(); });
    l.appendChild(sp); l.appendChild(i);
    return l;
  }

  function fieldSelect(labelTxt, value, options, onChange) {
    var l = document.createElement('label');
    var sp = document.createElement('span'); sp.textContent = labelTxt;
    var sel = document.createElement('select');
    options.forEach(function (o) {
      var op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      if (String(value) === String(o[0])) op.selected = true;
      sel.appendChild(op);
    });
    sel.addEventListener('change', function () { onChange(sel.value); markDirty(); });
    l.appendChild(sp); l.appendChild(sel);
    return l;
  }

  /* Multi-select chips, used for garment sizes. */
  function fieldPicks(labelTxt, all, chosen, onToggle) {
    var wrap = document.createElement('div');
    var sp = document.createElement('span');
    sp.style.cssText = 'display:block;font-size:14px;font-weight:600;margin:12px 0 0';
    sp.textContent = labelTxt;
    var row = document.createElement('div'); row.className = 'picks';
    all.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pick';
      b.setAttribute('aria-pressed', String(chosen.indexOf(v) !== -1));
      b.textContent = v;
      b.addEventListener('click', function () {
        onToggle(v);
        b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
        markDirty();
      });
      row.appendChild(b);
    });
    wrap.appendChild(sp); wrap.appendChild(row);
    return wrap;
  }

  function stockChip(obj, redraw) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-pressed', String(obj.available !== false));
    b.textContent = obj.available === false ? tx('outStock') : tx('inStock');
    b.addEventListener('click', function () {
      obj.available = (obj.available === false);
      markDirty(); redraw();
    });
    return b;
  }

  /* What is new. A date rather than a flag: a flag stays on until somebody
     remembers to take it off, and nobody ever does. Thirty days after he
     marks it, the label lets go by itself. */
  var NEW_DAYS = 30;
  function today() { return new Date().toISOString().slice(0, 10); }
  function newDaysLeft(o) {
    if (!o.newSince) return 0;
    var d = new Date(o.newSince + 'T00:00:00');
    if (isNaN(d.getTime())) return 0;
    return Math.max(0, Math.ceil(NEW_DAYS - (Date.now() - d.getTime()) / 86400000));
  }
  function isNewItem(o) { return newDaysLeft(o) > 0; }

  function newChip(obj, redraw) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    var on = isNewItem(obj);
    b.setAttribute('aria-pressed', String(on));
    b.textContent = tx('isNew');
    b.title = on ? tx('newFor', { n: newDaysLeft(obj) }) : tx('newOff');
    b.addEventListener('click', function () {
      obj.newSince = on ? '' : today();
      markDirty(); paintWaList(); redraw();
    });
    return b;
  }

  function photoChips(obj, path, redraw) {
    var out = [];
    var ph = document.createElement('button');
    ph.type = 'button'; ph.className = 'chip';
    ph.textContent = obj.photo ? tx('photoChange') : tx('photoAdd');
    ph.addEventListener('click', function () { attachPhoto(obj, path, redraw); });
    out.push(ph);
    if (obj.photo) {
      var rm = document.createElement('button');
      rm.type = 'button'; rm.className = 'chip danger'; rm.textContent = tx('photoRemove');
      rm.addEventListener('click', function () {
        obj.photo = ''; delete obj._preview; markDirty(); redraw();
      });
      out.push(rm);
    }
    return out;
  }

  /* Every item added through this page used to inherit the same leaf, so a
     bottle of milk went into the WhatsApp list as 🥬. The field still takes
     anything typed; these are just the ones a vegetable shop needs. */
  var EMOJI = ['🥔','🧅','🍅','🥒','🧄','🫑','🌶️','🥕','🥬','🥦','🍆','🎃',
               '🌽','🫚','🍠','🍋','🍌','🍎','🥛','🌿'];

  function emojiField(o) {
    var wrap = document.createElement('div');
    var fld = fieldText(tx('fEmoji'), o.emoji, function (v) { o.emoji = v.slice(0, 3); });
    var input = fld.querySelector('input');
    wrap.appendChild(fld);

    var sp = document.createElement('span');
    sp.style.cssText = 'display:block;font-size:14px;font-weight:600;margin:12px 0 0';
    sp.textContent = tx('fPick');
    var row = document.createElement('div'); row.className = 'picks';
    EMOJI.forEach(function (e) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pick';
      b.style.fontSize = '19px';
      b.textContent = e;
      b.setAttribute('aria-label', e);
      b.setAttribute('aria-pressed', String(o.emoji === e));
      b.addEventListener('click', function () {
        o.emoji = e; input.value = e;
        Array.prototype.forEach.call(row.children, function (c) {
          c.setAttribute('aria-pressed', 'false');
        });
        b.setAttribute('aria-pressed', 'true');
        markDirty(); paintWaList();
      });
      row.appendChild(b);
    });
    wrap.appendChild(sp); wrap.appendChild(row);
    return wrap;
  }

  /* One row: thumbnail, name, price, then a बदलें button that opens every
     other field. Keeping the long form collapsed is what makes a list of
     thirty items usable on a phone. */
  function itemRow(obj, opts) {
    var wrap = document.createElement('div');
    wrap.className = 'item' + (obj.available === false ? ' out' : '');

    var row = document.createElement('div'); row.className = 'row';

    var th = document.createElement('div'); th.className = 'thumb';
    var src = obj._preview || obj.photo || '';
    if (src) { var im = document.createElement('img'); im.src = src; th.appendChild(im); }
    else th.textContent = opts.fallbackEmoji;
    row.appendChild(th);

    var nm = document.createElement('div'); nm.className = 'nm';
    var bb = document.createElement('b'); bb.textContent = obj.hi || obj.en || obj.id;
    var ss = document.createElement('small'); ss.textContent = opts.sub(obj);
    nm.appendChild(bb); nm.appendChild(ss); row.appendChild(nm);

    var pr = document.createElement('input');
    pr.className = 'price'; pr.type = 'number'; pr.min = '0'; pr.step = '1';
    pr.inputMode = 'numeric'; pr.value = obj.price;
    pr.setAttribute('aria-label', tx('priceAria', { n: obj.hi || obj.id }));
    pr.addEventListener('input', function () { obj.price = Number(pr.value) || 0; markDirty(); opts.after && opts.after(); });
    row.appendChild(pr);
    wrap.appendChild(row);

    var acts = document.createElement('div'); acts.className = 'rowacts';

    var ed = document.createElement('button');
    ed.type = 'button'; ed.className = 'chip';
    ed.setAttribute('aria-expanded', String(!!obj._open));
    ed.textContent = obj._open ? tx('editClose') : tx('edit');
    ed.addEventListener('click', function () { obj._open = !obj._open; opts.redraw(); });
    acts.appendChild(ed);

    acts.appendChild(stockChip(obj, opts.redraw));
    if (opts.newChip) acts.appendChild(newChip(obj, opts.redraw));
    if (opts.sellPanel) acts.appendChild(sellChip(obj, opts.redraw));
    photoChips(obj, opts.photoPath(obj), opts.redraw).forEach(function (c) { acts.appendChild(c); });

    var del = document.createElement('button');
    del.type = 'button'; del.className = 'chip danger'; del.textContent = tx('del');
    del.addEventListener('click', function () {
      if (!confirm(tx('delAsk', { n: obj.hi || obj.id }))) return;
      opts.remove();
    });
    acts.appendChild(del);
    wrap.appendChild(acts);

    if (obj._open) wrap.appendChild(opts.panel(obj));
    if (obj._sell && opts.sellPanel) wrap.appendChild(opts.sellPanel(obj));
    return wrap;
  }

  /* ------------------------- a sale over the counter ---------------------
     The one sale this site cannot see for itself. Recording it here does two
     things at once: the stock comes down by what actually left the shop, and
     the Sales tab stops being a picture of the website alone. */
  function sellChip(o, redraw) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-expanded', String(!!o._sell));
    b.textContent = tx('sold');
    b.addEventListener('click', function () { o._sell = !o._sell; redraw(); });
    return b;
  }

  /* one choice out of a short list, unlike fieldPicks which takes many */
  function oneOf(labelTxt, all, chosen, onPick) {
    var wrap = document.createElement('div');
    var sp = document.createElement('span');
    sp.style.cssText = 'display:block;font-size:14px;font-weight:600;margin:12px 0 0';
    sp.textContent = labelTxt;
    var row = document.createElement('div'); row.className = 'picks';
    all.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pick';
      b.setAttribute('aria-pressed', String(v === chosen));
      b.textContent = v;
      b.addEventListener('click', function () {
        onPick(v);
        Array.prototype.forEach.call(row.children, function (c) {
          c.setAttribute('aria-pressed', 'false');
        });
        b.setAttribute('aria-pressed', 'true');
      });
      row.appendChild(b);
    });
    wrap.appendChild(sp); wrap.appendChild(row);
    return wrap;
  }

  function sellPanel(o, shop, redraw) {
    var box = document.createElement('div'); box.className = 'edit';
    var size = (o.sizes || [])[0] || '';
    var color = (o.colors || [])[0] || '';
    var qty = 1;

    var ttl = document.createElement('div'); ttl.className = 'sellttl';
    ttl.textContent = tx('soldTtl'); box.appendChild(ttl);

    /* a plain field, not fieldText: typing a quantity is not an edit to the
       catalogue and must not put the page into an unsaved state by itself */
    var lab = document.createElement('label');
    var sp = document.createElement('span'); sp.textContent = tx('soldQty');
    var inp = document.createElement('input');
    inp.type = 'number'; inp.min = '1'; inp.step = '1';
    inp.inputMode = 'numeric'; inp.value = '1';
    inp.addEventListener('input', function () {
      qty = Math.max(1, Math.round(Number(inp.value) || 1));
    });
    lab.appendChild(sp); lab.appendChild(inp); box.appendChild(lab);

    if ((o.sizes || []).length) {
      box.appendChild(oneOf(tx('soldSize'), o.sizes, size, function (v) { size = v; }));
    }
    if ((o.colors || []).length) {
      box.appendChild(oneOf(tx('soldColor'), o.colors, color, function (v) { color = v; }));
    }

    var go = document.createElement('button');
    go.type = 'button'; go.className = 'btn btn-go';
    go.style.marginTop = '14px'; go.textContent = tx('soldRec');
    go.addEventListener('click', function () {
      go.disabled = true; go.textContent = tx('soldSaving');
      o.stock = Math.max(0, (Number(o.stock) || 0) - qty);
      o._sell = false;
      logCounterSale(o, shop, qty, size, color);
      markDirty(); paintStockTotals(); redraw();
      doSave();
    });
    box.appendChild(go);

    var hint = document.createElement('p'); hint.className = 'help';
    hint.textContent = tx('soldHint'); box.appendChild(hint);
    return box;
  }

  /* Fire and forget, exactly as the two shop pages do it. A counter sale is
     recorded whether or not the server answers; the stock change is saved to
     git either way, and that is the number Tarun actually reads. */
  function logCounterSale(o, shop, qty, size, color) {
    var base = revBase();
    if (!base) return;
    try {
      fetch(base + '/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        keepalive: true,
        body: JSON.stringify({
          shop: shop, src: 'counter',
          items: [{ id: o.id, name: o.en || o.hi || o.id, size: size || '',
                    color: color || '', qty: qty, price: Number(o.price) || 0 }]
        })
      }).catch(function () {});
    } catch (e) { /* never block the stock update */ }
  }

  /* ------------------------------ vegetables ----------------------------- */
  /* Category names come from the catalogue, so show whichever of the two the
     shopkeeper is reading right now. */
  function catLabel(c) {
    return (alang ? (c.hi || c.en) : (c.en || c.hi)) || c.id;
  }
  function vegCats() {
    var d = files['index.html'].data;
    return (d.categories || []).map(function (c) { return [c.id, catLabel(c)]; });
  }

  /* One list of thirty-odd items on a phone is a scroll, not a list. The
     categories the shop already has make it a list again. */
  var vegFilter = 'all';

  function drawVegFilter() {
    var host = $('vegFilter');
    var cats = [['all', tx('allItems')]].concat(vegCats());
    host.innerHTML = '';
    if (cats.length < 3) return;
    cats.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pick';
      b.setAttribute('aria-pressed', String(vegFilter === c[0]));
      b.textContent = c[1];
      b.addEventListener('click', function () { vegFilter = c[0]; drawVeg(); });
      host.appendChild(b);
    });
  }

  function drawVeg() {
    var d = files['index.html'].data, host = $('vegList');
    host.innerHTML = '';
    drawVegFilter();
    (d.products || []).forEach(function (p, i) {
      if (vegFilter !== 'all' && p.cat !== vegFilter) return;
      host.appendChild(itemRow(p, {
        fallbackEmoji: p.emoji || '🥬',
        sub: function (o) { return (o.en || '') + ' · ' + unitShort(o.unit) + ' · ' + stockLine(o); },
        photoPath: function (o) { return (o.id || 'item' + i) + '.jpg'; },
        redraw: function () { drawVeg(); paintWaList(); },
        after: paintWaList,
        remove: function () { d.products.splice(i, 1); markDirty(); drawVeg(); paintWaList(); },
        panel: function (o) {
          var box = document.createElement('div'); box.className = 'edit';

          var g = document.createElement('div'); g.className = 'grid2';
          g.appendChild(fieldText(tx('fName'), o.hi, function (v) { o.hi = v; }));
          g.appendChild(fieldText(tx('fNameEn'), o.en, function (v) { o.en = v; }));
          box.appendChild(g);

          var g2 = document.createElement('div'); g2.className = 'grid2';
          g2.style.marginTop = '10px';
          g2.appendChild(fieldSelect(tx('fCat'), o.cat, vegCats(), function (v) { o.cat = v; }));
          g2.appendChild(fieldSelect(tx('fSoldBy'), o.unit, [
            ['kg', tx('uKg')], ['250g', tx('u250')], ['pc', tx('uPc')], ['bunch', tx('uBunch')]
          ], function (v) { o.unit = v; o.step = (v === 'kg' ? 0.5 : 1); paintWaList(); }));
          box.appendChild(g2);

          box.appendChild(emojiField(o));

          box.appendChild(fieldText(tx('fStock', { u: baseLabel(o, 'veg') }), o.stock,
            function (v) { o.stock = Math.max(0, Number(v) || 0); paintStockTotals(); },
            { type: 'number', numeric: true, step: '0.01', placeholder: tx('phStock') }));

          box.appendChild(costBlock(o, 'veg', paintStockTotals));

          if (!(Number(o.price) > 0)) {
            var np = document.createElement('p'); np.className = 'help bad';
            np.textContent = tx('noPrice');
            box.appendChild(np);
          }

          var p2 = document.createElement('p'); p2.className = 'help';
          p2.textContent = tx('vegEditNote');
          box.appendChild(p2);
          return box;
        }
      }));
    });
  }

  /* A count Tarun keeps by hand. Nothing decrements it automatically: the
     page cannot see a walk-in sale, so a number that moved on its own would
     be wrong more often than right. */
  function stockLine(o) {
    var n = Number(o.stock) || 0;
    return n > 0 ? tx('stockN', { n: n }) : tx('stockNone');
  }

  /* -------------------------- cost, not shelf price ----------------------
     What the stock in the shop is worth to Tarun is what he paid for it, not
     what he hopes to get. ₹200 for 25 kilos of potato is ₹8 a kilo whatever
     the rate list says that morning.

     Everything is counted in the item's base unit: the kilo for anything
     sold by weight, the नग, the गड्डी, the piece. A 250-gram price is the
     one place the sale unit and the base unit part company, and it is four
     to the kilo. */
  function baseUnit(o, shop) {
    if (shop === 'gar') return 'piece';
    return o.unit === 'pc' ? 'pc' : (o.unit === 'bunch' ? 'bunch' : 'kg');
  }
  function baseLabel(o, shop) {
    var u = baseUnit(o, shop);
    return tx(u === 'kg' ? 'bKg' : u === 'pc' ? 'bPc' : u === 'bunch' ? 'bBunch' : 'bPiece');
  }
  function sellPerBase(o, shop) {
    var p = Number(o.price) || 0;
    return (shop !== 'gar' && o.unit === '250g') ? p * 4 : p;
  }
  function costPerBase(o) {
    var paid = Number(o.buyPrice) || 0, came = Number(o.buyQty) || 0;
    if (paid <= 0 || came <= 0) return null;      /* not entered yet */
    return paid / came;
  }
  function money(n) {
    return Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  /* The two purchase fields plus the line that does the arithmetic for him.
     Shown live, so the sum is visible before he has finished typing. */
  function costBlock(o, shop, after) {
    var wrap = document.createElement('div');
    var unit = baseLabel(o, shop);

    var h = document.createElement('div'); h.className = 'sellttl';
    h.style.marginTop = '12px'; h.textContent = tx('costH');
    wrap.appendChild(h);

    var g = document.createElement('div'); g.className = 'grid2';
    g.appendChild(fieldText(tx('fBuyPrice'), o.buyPrice || '',
      function (v) { o.buyPrice = Math.max(0, Number(v) || 0); paint(); after && after(); },
      { type: 'number', numeric: true, placeholder: tx('phBuyPrice') }));
    g.appendChild(fieldText(tx('fBuyQty', { u: unit }), o.buyQty || '',
      function (v) { o.buyQty = Math.max(0, Number(v) || 0); paint(); after && after(); },
      { type: 'number', numeric: true, step: '0.01', placeholder: tx('phBuyQty') }));
    wrap.appendChild(g);

    var line = document.createElement('p');
    wrap.appendChild(line);
    paint();
    return wrap;

    function paint() {
      var c = costPerBase(o), sell = sellPerBase(o, shop);
      if (c == null) {
        line.className = 'help';
        line.textContent = tx('costNone', { u: unit });
        return;
      }
      var made = sell - c;
      /* a negative profit reads as a typo, so say the loss in its own words */
      line.className = made < 0 ? 'help bad' : 'help';
      line.textContent = made < 0
        ? tx('costLoss', { c: money(c), u: unit, p: money(sell), m: money(-made) })
        : tx('costLine', { c: money(c), u: unit, p: money(sell), m: money(made),
                           pc: Math.round(made / c * 100) });
    }
  }

  function stockTotals(list, shop) {
    var t = { n: 0, cost: 0, retail: 0, missing: 0 };
    list.forEach(function (o) {
      var have = Number(o.stock) || 0;
      t.n += have;
      t.retail += have * sellPerBase(o, shop);
      var c = costPerBase(o);
      if (c == null) { if (have > 0) t.missing++; }
      else t.cost += have * c;
    });
    return t;
  }

  function paintStockTotals() {
    if (files['index.html']) one('vegTotal', files['index.html'].data.products || [], 'veg');
    if (files['garments.html']) one('garTotal', garList(), 'gar');

    function one(id, list, shop) {
      var t = stockTotals(list, shop), node = $(id);
      node.textContent = tx('stockWorth', { n: money(t.n), c: money(t.cost), v: money(t.retail) });
      if (t.missing) {
        var s = document.createElement('span');
        s.className = 'nocost';
        s.textContent = tx('stockNoCost', { n: t.missing });
        node.appendChild(s);
      }
    }
  }

  /* ------------------------------- garments ------------------------------ */
  /* Letter sizes then waist sizes, in the order a shopkeeper reads them.
     Tarun's own list runs to 5XL and to waist 44, so the range has to cover it. */
  var SIZES = ['XS','S','M','L','XL','XXL','3XL','4XL','5XL',
               '28','30','32','34','36','38','40','42','44','46'];

  function garCats() {
    var d = files['garments.html'].data;
    return (d.categories || []).map(function (c) { return [c.id, catLabel(c)]; });
  }
  function garList() {
    var d = files['garments.html'].data;
    if (!d.items) d.items = d.products || [];
    return d.items;
  }

  function drawGar() {
    var list = garList(), host = $('garList');
    host.innerHTML = '';
    list.forEach(function (p, i) {
      host.appendChild(itemRow(p, {
        fallbackEmoji: '👕',
        sub: function (o) {
          var bits = [];
          if ((o.sizes || []).length) bits.push((o.sizes || []).join('/'));
          if ((o.colors || []).length) bits.push((o.colors || []).join(', '));
          bits.push(stockLine(o));
          return bits.join(' · ');
        },
        photoPath: function (o) { return 'garments/' + (o.id || 'item' + i) + '.jpg'; },
        redraw: drawGar,
        sellPanel: function (o) { return sellPanel(o, 'gar', drawGar); },
        newChip: true,
        remove: function () { list.splice(i, 1); markDirty(); drawGar(); },
        panel: function (o) {
          var box = document.createElement('div'); box.className = 'edit';

          var g = document.createElement('div'); g.className = 'grid2';
          g.appendChild(fieldText(tx('fName'), o.hi, function (v) { o.hi = clean1(v); }));
          g.appendChild(fieldText(tx('fNameEn'), o.en, function (v) { o.en = clean1(v); }));
          box.appendChild(g);

          var g2 = document.createElement('div'); g2.className = 'grid2';
          g2.style.marginTop = '10px';
          g2.appendChild(fieldSelect(tx('fFor'), o.cat, garCats(), function (v) { o.cat = v; }));
          g2.appendChild(fieldText(tx('fMrp'), o.mrp, function (v) { o.mrp = Number(v) || 0; },
            { type: 'number', numeric: true, placeholder: tx('phMrp') }));
          box.appendChild(g2);

          if (!o.sizes) o.sizes = [];
          box.appendChild(fieldPicks(tx('fSizes'), SIZES, o.sizes, function (v) {
            var k = o.sizes.indexOf(v);
            if (k === -1) o.sizes.push(v); else o.sizes.splice(k, 1);
            o.sizes.sort(function (a, b) { return SIZES.indexOf(a) - SIZES.indexOf(b); });
          }));

          box.appendChild(fieldText(tx('fColors'), (o.colors || []).join(', '),
            function (v) {
              o.colors = v.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
            }, { placeholder: tx('phColors') }));

          box.appendChild(fieldText(tx('fFabric'), o.fabric, function (v) { o.fabric = clean1(v); },
            { placeholder: tx('phFabric') }));

          box.appendChild(fieldText(tx('fStock', { u: baseLabel(o, 'gar') }), o.stock,
            function (v) { o.stock = Math.max(0, Number(v) || 0); paintStockTotals(); },
            { type: 'number', numeric: true, placeholder: tx('phStock') }));

          box.appendChild(costBlock(o, 'gar', paintStockTotals));

          box.appendChild(fieldText(tx('fNote'), o.note,
            function (v) { o.note = v.replace(/\s+/g, ' ').slice(0, 160); },
            { area: true, rows: 3, placeholder: tx('phNote') }));

          var p2 = document.createElement('p'); p2.className = 'help';
          p2.textContent = tx('garEditNote');
          box.appendChild(p2);

          var p3 = document.createElement('p'); p3.className = 'help';
          p3.textContent = isNewItem(o) ? tx('newFor', { n: newDaysLeft(o) }) + '. ' + tx('newHint')
                                        : tx('newHint');
          box.appendChild(p3);
          return box;
        }
      }));
    });
  }

  /* Names go into a WhatsApp message and a one-line card, so newlines and
     double spaces break both, so flatten them on the way in. */
  function clean1(v) { return String(v).replace(/\s+/g, ' ').trim(); }

  function drawSet() {
    var s = files['index.html'].data.store;
    $('setOpen').value  = s.openTime || '';
    $('setClose').value = s.closeTime || '';
    $('setLast').value  = s.lastOrderTime || '';
    $('setMin').value   = s.minOrder || 0;
    $('setHours').value = s.reportHours || 24;
    $('setUpi').value   = s.upiId || '';
    paintWaList();
  }

  [['setOpen', 'openTime'], ['setClose', 'closeTime'], ['setLast', 'lastOrderTime'],
   ['setUpi', 'upiId']].forEach(function (pair) {
    $(pair[0]).addEventListener('input', function () {
      files['index.html'].data.store[pair[1]] = $(pair[0]).value; markDirty();
    });
  });
  [['setMin', 'minOrder'], ['setHours', 'reportHours']].forEach(function (pair) {
    $(pair[0]).addEventListener('input', function () {
      files['index.html'].data.store[pair[1]] = Number($(pair[0]).value) || 0; markDirty();
    });
  });

  /* Goes into the WhatsApp rate list, which is read by the society group, so
     always Hindi, whatever language this page is showing. */
  function unitLabel(u) {
    return u === 'kg' ? '1 किलो' : u === '250g' ? '250 ग्राम' : u === 'bunch' ? '1 गड्डी' : '1 नग';
  }
  /* The same unit, in whichever language the shopkeeper is using here. */
  function unitShort(u) {
    return u === 'kg' ? tx('uKg') : u === '250g' ? tx('u250') : u === 'bunch' ? tx('uBunch') : tx('uPc');
  }
  var SITE = 'https://guru-ashish.in';

  function paintWaList() {
    if (!files['index.html']) return;
    var d = files['index.html'].data, s = d.store;
    var out = ['🛒 *आज की रेट लिस्ट* 🛒', ''];
    /* The rate list is the morning's vegetable rates, which is why anyone
       reads it. The spices are a fixed catalogue of nearly sixty packets and
       would bury them, so they get one line and a link instead. */
    var spices = 0;

      if (p.available === false || !(Number(p.price) > 0)) return;

    });
    out.push('', '✨ 100% ताज़ा, रोज़ सुबह मंडी से ✨',
      '🚚 फ्री होम डिलीवरी, ' + (s.deliveryMinutes || '15-20') + ' मिनट में', '',
      '🛒 ऑर्डर: ' + SITE);

    if (spices) out.push('', '🧂 मसाले भी मिलते हैं, ' + spices + ' तरह के');

    /* The same message carries the other shop. Most of the society knows
       Tarun for vegetables and has never heard about the clothes. */
    if (files['garments.html']) {

      if (fresh.length) {
        out.push('✨ *नया आया है*: ' + fresh.slice(0, 6).join(', '));
      }

    }

    out.push('', '📞 ' + (s.phone || ''), '📍 ' + (s.address || ''));

  /* ---------------------- the rate list as a picture ---------------------
     WhatsApp will not put a photograph inside a typed message, and the
     photographs are the whole reason a rate list is worth reading. So draw
     one: the same list, with the real pictures, as a single image Tarun
     sends to the group and pastes the text under.

     Every photo here is same-origin, either a file next to this page or a
     data: URI he has just picked, so the canvas stays clean and can be
     exported. */
  var PIC = { W: 1000, ROW: 132, HEAD: 212, FOOT: 196 };

  function loadImg(src) {
    return new Promise(function (done) {
      if (!src) return done(null);
      var im = new Image();
      im.onload = function () { done(im); };
      im.onerror = function () { done(null); };   /* a missing photo is not fatal */
      im.src = src;
    });
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawRateCard() {
    var d = files['index.html'].data, st = d.store;
    var list = (d.products || []).filter(function (p) {
      return p.available !== false && Number(p.price) > 0 && p.cat !== 'kokora';
    });
    var H = PIC.HEAD + list.length * PIC.ROW + PIC.FOOT;
    var cv = document.createElement('canvas');
    cv.width = PIC.W; cv.height = H;
    var c = cv.getContext('2d');
    var F = '"Noto Sans Devanagari", system-ui, sans-serif';

    c.fillStyle = '#fdfaf3'; c.fillRect(0, 0, PIC.W, H);

    /* header */
    c.fillStyle = '#5b1839'; c.fillRect(0, 0, PIC.W, PIC.HEAD - 26);
    c.fillStyle = '#fff';
    c.font = '700 46px ' + F;
    c.fillText(st.name || 'गुरु आशीष', 44, 84);
    c.font = '700 34px ' + F;
    c.fillStyle = '#f3d9a4';
    c.fillText('आज की रेट लिस्ट', 44, 136);
    c.font = '500 26px ' + F;
    c.fillStyle = 'rgba(255,255,255,.82)';
    var dt = new Date().toLocaleDateString('hi-IN', { day: 'numeric', month: 'long' });
    c.textAlign = 'right'; c.fillText(dt, PIC.W - 44, 136); c.textAlign = 'left';

    return Promise.all(list.map(function (p) {
      return loadImg(p._preview || p.photo || '');
    })).then(function (shots) {
      list.forEach(function (p, i) {
        var y = PIC.HEAD + i * PIC.ROW;
        if (i % 2 === 0) {
          c.fillStyle = '#f6efe1';
          roundRect(c, 30, y - 8, PIC.W - 60, PIC.ROW - 14, 18); c.fill();
        }

        var box = 96, bx = 50, by = y + 4;
        c.save();
        roundRect(c, bx, by, box, box, 18); c.clip();
        if (shots[i]) {
          var im = shots[i];
          var sc = Math.max(box / im.width, box / im.height);
          var w = im.width * sc, h = im.height * sc;
          c.drawImage(im, bx + (box - w) / 2, by + (box - h) / 2, w, h);
        } else {
          c.fillStyle = '#e8dcc2'; c.fillRect(bx, by, box, box);
          c.font = '54px ' + F; c.textAlign = 'center';
          c.fillStyle = '#5b1839';
          c.fillText(p.emoji || '•', bx + box / 2, by + box / 2 + 20);
          c.textAlign = 'left';
        }
        c.restore();

        c.fillStyle = '#2a1a10';
        c.font = '700 38px ' + F;
        c.fillText(p.hi || p.en || '', bx + box + 26, y + 46);
        c.fillStyle = '#7a6a58';
        c.font = '500 26px ' + F;
        c.fillText(unitLabel(p.unit), bx + box + 26, y + 84);

        c.textAlign = 'right';
        c.fillStyle = '#1b7a3e';
        c.font = '800 44px ' + F;
        c.fillText('₹' + p.price, PIC.W - 50, y + 66);
        c.textAlign = 'left';
      });

      var fy = PIC.HEAD + list.length * PIC.ROW + 30;
      c.fillStyle = '#5b1839';
      roundRect(c, 30, fy, PIC.W - 60, PIC.FOOT - 66, 20); c.fill();
      c.fillStyle = '#fff';
      c.font = '700 30px ' + F;
      c.fillText('🚚 फ्री होम डिलीवरी · ' + (st.deliveryMinutes || '15-20') + ' मिनट', 60, fy + 52);
      c.font = '500 27px ' + F;
      c.fillStyle = 'rgba(255,255,255,.9)';
      c.fillText('📞 ' + (st.phone || '') + '   ·   ' + SITE.replace(/^https:\/\//, ''), 60, fy + 98);
      return cv;
    });
  }

  /* ------------------------------- reviews ------------------------------- */
  var REV_KEY = 'gavs.admin.revkey.v1';
  var reviews = [];

  function revBase() { return ($('revUrl').value || '').trim().replace(/\/+$/, ''); }
  function revSecret() { return ($('revKey').value || '').trim(); }

  function revErr(msg) {
    var p = $('revErr');
    if (!msg) { p.classList.add('hidden'); p.textContent = ''; return; }
    p.classList.remove('hidden'); p.textContent = msg;
  }

  function starText(n) {
    n = Math.max(0, Math.min(5, Math.round(Number(n) || 0)));
    return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
  }

  function revDate(ts) {
    var d = new Date(Number(ts) || 0);
    if (!ts || isNaN(d.getTime())) return '';
    try { return d.toLocaleDateString('hi-IN', { day: 'numeric', month: 'short' }); }
    catch (e) { return d.getDate() + '/' + (d.getMonth() + 1); }
  }

  /* every review call answers with JSON, so read it either way */
  function revFetch(url, opts) {
    return fetch(url, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok || !j.ok) {
          throw new Error(j.error === 'unauthorised' ? tx('revBadKey') : tx('revNoAns'));
        }
        return j;
      });
    }, function () { throw new Error(tx('revNoNet')); });
  }

  function loadRev() {
    if (!revBase()) { revErr(tx('revNeedUrl')); return; }
    if (!revSecret()) { revErr(tx('revNeedKey')); return; }
    try { localStorage.setItem(REV_KEY, revSecret()); } catch (e) {}
    revErr('');
    $('revLoad').disabled = true;
    $('revLoad').textContent = tx('revLoading');
    revFetch(revBase() + '/admin?key=' + encodeURIComponent(revSecret()), { cache: 'no-store' })
      .then(function (j) {
        reviews = j.reviews || [];
        $('revCard').classList.remove('hidden');
        drawRevList();
      })
      .catch(function (e) { revErr(e.message); })
      .then(function () {
        $('revLoad').disabled = false;
        $('revLoad').textContent = tx('revAgain');
      });
  }

  /* moderation goes straight to the reviews server, nothing to save in git */
  function revAction(r, action, btn) {
    btn.disabled = true;
    revFetch(revBase() + '/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: revSecret(), action: action, id: r.id })
    })
      .then(function () {
        if (action === 'delete') {
          reviews = reviews.filter(function (x) { return x.id !== r.id; });
        } else if (action === 'feature')   { r.featured = true;  }
        else if (action === 'unfeature')   { r.featured = false; }
        else if (action === 'hide')        { r.hidden = true;    }
        else if (action === 'show')        { r.hidden = false;   }
        revErr('');
        drawRevList();
      })
      .catch(function (e) { btn.disabled = false; revErr(e.message); });
  }

  function drawRevList() {
    var host = $('revList');
    host.innerHTML = '';

    var shown = reviews.filter(function (r) { return !r.hidden; });
    var avg = shown.length
      ? Math.round((shown.reduce(function (a, r) { return a + (Number(r.stars) || 0); }, 0) / shown.length) * 10) / 10
      : 0;
    $('revCount').textContent = shown.length
      ? tx('revStat', { n: shown.length, a: avg })
      : tx('revNoneShort');

    if (!reviews.length) {
      var none = document.createElement('p');
      none.className = 'hint';
      none.textContent = tx('revNone');
      host.appendChild(none);
      return;
    }

    reviews.forEach(function (r) {
      var wrap = document.createElement('div');
      wrap.className = 'item' + (r.hidden ? ' out' : '');

      var head = document.createElement('div');
      var st = document.createElement('span');
      st.className = 'stars'; st.textContent = starText(r.stars);
      head.appendChild(st);
      if (r.featured) {
        var bg = document.createElement('span');
        bg.className = 'badge'; bg.textContent = tx('revOnTop');
        head.appendChild(bg);
      }
      wrap.appendChild(head);

      var meta = document.createElement('div');
      meta.className = 'rev-meta';
      meta.textContent = [r.name || tx('revNoName'), r.flat || '', revDate(r.ts)]
        .filter(function (x) { return x; }).join(' • ');
      wrap.appendChild(meta);

      if (r.text) {
        /* not `tx`: that is the translator, and a local of the same name
           shadows it for the whole function, which broke every label below */
        var body = document.createElement('p');
        body.className = 'rev-text'; body.textContent = r.text;
        wrap.appendChild(body);
      }

      var acts = document.createElement('div');
      acts.className = 'rowacts';

      var feat = document.createElement('button');
      feat.type = 'button'; feat.className = 'chip';
      feat.setAttribute('aria-pressed', String(!!r.featured));
      feat.textContent = r.featured ? tx('revUnfeat') : tx('revFeature');
      feat.addEventListener('click', function () {
        revAction(r, r.featured ? 'unfeature' : 'feature', feat);
      });
      acts.appendChild(feat);

      var hid = document.createElement('button');
      hid.type = 'button'; hid.className = 'chip';
      hid.textContent = r.hidden ? tx('revShow') : tx('revHide');
      hid.addEventListener('click', function () {
        revAction(r, r.hidden ? 'show' : 'hide', hid);
      });
      acts.appendChild(hid);

      var del = document.createElement('button');
      del.type = 'button'; del.className = 'chip danger'; del.textContent = tx('revDelete');
      del.addEventListener('click', function () {
        if (!confirm(tx('revDelAsk'))) return;
        revAction(r, 'delete', del);
      });
      acts.appendChild(del);

      wrap.appendChild(acts);
      host.appendChild(wrap);
    });
  }

  }

  /* The vegetable page shows a strip of garments, but it cannot read the
     garment catalogue at runtime, because both pages are standalone files. So the

  /* ------------------------------ analytics ------------------------------
     Counts orders started on the website. A walk-in never reaches here and a
     customer who taps send without sending the WhatsApp does, which is why
     the tab leads with a warning rather than a headline number. */
  var orders = null;
  var anaDays = 30;

  function anaErr(msg) {
    var p = $('anaErr');
    if (!msg) { p.classList.add('hidden'); p.textContent = ''; return; }
    p.classList.remove('hidden'); p.textContent = msg;
  }

  function drawRange() {
    var host = $('anaRange');
    host.innerHTML = '';
    [[7, 'r7'], [30, 'r30'], [90, 'r90'], [0, 'rAll']].forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pick';

  function loadAna() {
    if (!revBase() || !revSecret()) { anaErr(tx('anaNeed')); return; }
    anaErr('');
    $('anaLoad').disabled = true;
    $('anaLoad').textContent = tx('anaLoading');

      .then(function (j) { orders = j.orders || []; drawAna(); })
      .catch(function (e) { anaErr(e.message); })
      .then(function () {
        $('anaLoad').disabled = false;
        $('anaLoad').textContent = tx('anaAgain');
      });

  function inRange(o) {
    if (!anaDays) return true;
    return o.ts >= Date.now() - anaDays * 86400000;
  }

  /* one horizontal bar per row, widest value setting the scale */
  function barList(rows, unit) {
    var wrap = document.createElement('div');
    var max = rows.reduce(function (m, r) { return Math.max(m, r.v); }, 0) || 1;
    rows.forEach(function (r) {
      var d = document.createElement('div'); d.className = 'bar';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.k;
      var tr = document.createElement('span'); tr.className = 'track';
      var fl = document.createElement('span'); fl.className = 'fill';
      fl.style.width = Math.round(r.v / max * 100) + '%';
      tr.appendChild(fl);
      var vv = document.createElement('span'); vv.className = 'val';
      vv.textContent = r.v + (unit || '');
      d.appendChild(nm); d.appendChild(tr); d.appendChild(vv);
      wrap.appendChild(d);
    });
    return wrap;
  }

  function tally(list, keyFn, addFn) {
    var map = {};
    list.forEach(function (x) {
      var k = keyFn(x);
      if (!k) return;
      map[k] = (map[k] || 0) + addFn(x);
    });
    return Object.keys(map).map(function (k) { return { k: k, v: map[k] }; })
      .sort(function (a, b) { return b.v - a.v; });
  }

  function card(title, node, hint) {
    var c = document.createElement('div'); c.className = 'card';
    var h = document.createElement('h2'); h.textContent = title;
    c.appendChild(h);
    if (hint) { var p = document.createElement('p'); p.className = 'help'; p.textContent = hint; c.appendChild(p); }
    c.appendChild(node);
    return c;
  }

  function priceBand(n) {
    if (n < 100) return '₹0 to 99';
    if (n < 300) return '₹100 to 299';
    if (n < 500) return '₹300 to 499';
    if (n < 800) return '₹500 to 799';
    return '₹800+';
  }

  function drawAna() {
    var host = $('anaOut');
    host.innerHTML = '';
    var use = (orders || []).filter(inRange);

    if (!use.length) {
      var none = document.createElement('div'); none.className = 'card';
      none.innerHTML = '<p class="help"></p>';
      none.querySelector('p').textContent = tx('anaNone');
      host.appendChild(none);
      return;
    }

    /* headline numbers */
    var lines = [];
    use.forEach(function (o) {
      (o.items || []).forEach(function (l) { lines.push({ o: o, l: l }); });
    });
    var pieces = lines.reduce(function (a, x) { return a + x.l.qty; }, 0);
    var value = use.reduce(function (a, o) { return a + (o.total || 0); }, 0);

    var kpi = document.createElement('div'); kpi.className = 'kpi';
    [[use.length, tx('kOrders')], [pieces, tx('kPieces')],
     ['₹' + value.toLocaleString('en-IN'), tx('kValue')],
     ['₹' + Math.round(value / use.length).toLocaleString('en-IN'), tx('kAvg')]
    ].forEach(function (p) {
      var d = document.createElement('div');
      var b = document.createElement('b'); b.textContent = p[0];
      var sp = document.createElement('span'); sp.textContent = p[1];
      d.appendChild(b); d.appendChild(sp); kpi.appendChild(d);
    });
    /* Two very different numbers under one heading would mislead, so say
       which is which whenever both are present. */
    var counter = use.filter(function (o) { return o.src === 'counter'; }).length;
    var box = document.createElement('div');
    box.appendChild(kpi);
    if (counter) {
      var sl = document.createElement('p'); sl.className = 'srcline';
      sl.textContent = tx('anaSrc', { w: use.length - counter, c: counter });
      box.appendChild(sl);
    }
    host.appendChild(card(tx('anaPeriod'), box));

    [['veg', 'secVeg', 'index.html', 'products'],
     ['gar', 'secGar', 'garments.html', 'items']].forEach(function (sh) {
      var mine = lines.filter(function (x) { return x.o.shop === sh[0]; });
      if (!mine.length) return;

      var head = document.createElement('div'); head.className = 'card';
      head.innerHTML = '<h2></h2>';
      head.querySelector('h2').textContent = tx(sh[1]);
      host.appendChild(head);

      host.appendChild(card(tx('secFast'),
        barList(tally(mine, function (x) { return x.l.name; },
                      function (x) { return x.l.qty; }).slice(0, 10))));

      /* what nobody asked for, which needs the catalogue this page holds */
      var cat = files[sh[2]] ? (files[sh[2]].data[sh[3]] || []) : [];
      var asked = {};
      mine.forEach(function (x) { asked[x.l.id] = 1; });
      var dead = cat.filter(function (it) { return !asked[it.id]; });
      if (dead.length) {
        var d = document.createElement('div'); d.className = 'dead';
        dead.forEach(function (it) {
          var row = document.createElement('div');
          row.textContent = '• ' + (it.hi || it.en || it.id) +
            (it.photo ? '' : '  (' + tx('photoAdd') + ')');
          d.appendChild(row);
        });
        host.appendChild(card(tx('secSlow'), d, tx('slowHint')));
      }

      if (sh[0] === 'gar') {
        var sizes = tally(mine, function (x) { return x.l.size; }, function (x) { return x.l.qty; });
        if (sizes.length) host.appendChild(card(tx('secSize'), barList(sizes)));
        var cols = tally(mine, function (x) { return x.l.color; }, function (x) { return x.l.qty; });
        if (cols.length) host.appendChild(card(tx('secColor'), barList(cols)));
      }

      host.appendChild(card(tx('secPrice'),
        barList(tally(mine, function (x) { return priceBand(x.l.price); },
                      function (x) { return x.l.qty; }))));
    });
  }

  $('anaLoad').addEventListener('click', loadAna);

  /* -------------------------------- tabs --------------------------------- */
  function tab(which) {
    [['tabVeg', 'paneVeg'], ['tabGar', 'paneGar'], ['tabRev', 'paneRev'],
     ['tabAna', 'paneAna'], ['tabSet', 'paneSet']].forEach(function (t) {
      var on = t[0] === which;
      $(t[0]).setAttribute('aria-selected', String(on));
      $(t[1]).classList.toggle('hidden', !on);
    });
  }
  /* --------------------------- language toggle --------------------------- */
  $('langBtn').addEventListener('click', function () {
    alang = alang ? 0 : 1;
    try { localStorage.setItem(LANG_KEY, alang ? 'hi' : 'en'); } catch (e) {}
    paintUI();
    /* redraw anything already on screen so its labels follow */
    if (files['index.html']) { drawVeg(); drawSet(); }
    if (files['garments.html']) drawGar();
    if (reviews.length) drawRevList();
  });
  paintUI();

  $('tabVeg').addEventListener('click', function () { tab('tabVeg'); });
  $('tabGar').addEventListener('click', function () { tab('tabGar'); });
  $('tabRev').addEventListener('click', function () { tab('tabRev'); });
  $('tabAna').addEventListener('click', function () { tab('tabAna'); });
  $('tabSet').addEventListener('click', function () { tab('tabSet'); });

  /* -------------------------------- save ---------------------------------
     A function rather than only a click handler: recording a counter sale
     changes the stock, and a stock number that is right on the phone and
     wrong in the repository is worse than not having it. So that button
     saves for him. */
  function doSave() {
    $('save').disabled = true;
    setStatus(tx('saving'), true);
    var chain = Promise.resolve();
    pendingPhotos.forEach(function (ph) {
      chain = chain.then(function () { return savePhoto(ph); });
    });
    return chain
      .then(function () { pendingPhotos = []; syncCrossSell(); syncShared(); return saveFile('index.html'); })
      .then(function () { return saveFile('garments.html'); })
      .then(function () {
        setStatus(tx('savedOk'));
        $('save').disabled = true;
      })
      .catch(function (e) {
        $('save').disabled = false;
        if (e.message === 'AUTH') { setStatus(tx('saveAuth')); logout(); }
        else if (/409/.test(e.message)) setStatus(tx('saveClash'));
        else setStatus(tx('saveFail') + e.message);
      });
  }
  $('save').addEventListener('click', doSave);

  /* -------------------------------- login -------------------------------- */
  function boot(t) {
    token = t;
    $('loginErr').classList.add('hidden');
    $('doLogin').disabled = true;
    $('doLogin').textContent = tx('opening');
    Promise.all([loadFile('index.html'), loadFile('garments.html')])
      .then(function () {
        try { localStorage.setItem(TOK_KEY, token); } catch (e) {}
        $('login').classList.add('hidden');
        $('editor').classList.remove('hidden');
        $('savebar').classList.remove('hidden');
        drawVeg(); drawGar(); drawSet(); drawRev(); paintStockTotals(); drawRange();
        setStatus(tx('savedAll'));
        $('save').disabled = true;
      })
      .catch(function (e) {
        $('doLogin').disabled = false;
        $('doLogin').textContent = tx('open');
        $('loginErr').classList.remove('hidden');
        $('loginErr').textContent = e.message === 'AUTH'
          ? tx('badTok')
          : (tx('somethingUp') + e.message);
      });
  }
  $('doLogin').addEventListener('click', function () {
    var t = $('tok').value.trim();
    if (!t) { $('loginErr').classList.remove('hidden'); $('loginErr').textContent = tx('needTok'); return; }
    boot(t);
  });
  $('tok').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('doLogin').click(); });

  function logout() {
    try { localStorage.removeItem(TOK_KEY); localStorage.removeItem(REV_KEY); } catch (e) {}
    token = ''; files = {}; pendingPhotos = []; reviews = [];
    $('revCard').classList.add('hidden');
    $('revKey').value = ''; revErr('');
    $('editor').classList.add('hidden');
    $('savebar').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('tok').value = '';
    $('doLogin').disabled = false;
    $('doLogin').textContent = tx('open');
  }
  $('logout').addEventListener('click', function () {
    if (confirm(tx('logoutAsk'))) logout();
  });

  window.addEventListener('beforeunload', function (e) {
    var dirty = Object.keys(files).some(function (k) { return files[k].dirty; });
    if (dirty || pendingPhotos.length) { e.preventDefault(); e.returnValue = ''; }
  });

  /* auto-login if a token is already on this phone */
  var saved = '';
  try { saved = localStorage.getItem(TOK_KEY) || ''; } catch (e) {}
  if (saved) boot(saved);
})();
</script>
</body>
</html>
