<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b1339">
<title>गुरु आशीष गारमेंट्स</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{
  --leaf:#14663a; --leaf-d:#0e4d2b; --leaf-l:#e4f0e7; --leaf-line:#c3ddca;
  --brand:#4b1339; --brand-2:#6a1b4d; --marigold:#e8a92c;
  --carrot:#b8480a; --carrot-d:#8f3706;
  --cream:#fdf8ee; --paper:#ffffff; --ink:#1b211c; --muted:#57655a;
  --line:#e3ddcd; --r:18px;
  --shadow:0 1px 2px rgba(27,45,32,.06), 0 6px 18px rgba(27,45,32,.06);
  --tap:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16.5px; line-height:1.62; text-wrap:pretty; padding-bottom:34px;
}
html[lang="bn"] body{font-family:"Noto Sans Bengali","Nirmala UI",system-ui,sans-serif}
html[lang="pa"] body{font-family:"Noto Sans Gurmukhi","Nirmala UI",system-ui,sans-serif}
html[lang="te"] body{font-family:"Noto Sans Telugu","Nirmala UI",system-ui,sans-serif}
html[lang="en"] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button,input{font-family:inherit;font-size:inherit}
a{color:var(--leaf-d);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--carrot)}
:focus-visible{outline:3px solid var(--leaf-d);outline-offset:2px;border-radius:6px}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}

/* ---------- shared header treatment ---------- */
.hdr{background:var(--brand);background-image:linear-gradient(178deg,var(--brand-2),var(--brand));color:#fff;padding:12px 0 26px;position:relative}
.hdr:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--cream);
  border-radius:16px 16px 0 0;border-top:3px solid var(--marigold)}
.hdr-top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.shop{min-width:0}
.shop h1{font-family:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif;font-size:23px;font-weight:700;letter-spacing:.2px;line-height:1.24}
.shop .sub{font-size:12.5px;opacity:.82;font-weight:500;letter-spacing:.3px;text-transform:uppercase}
.lang{position:relative;flex:0 0 auto}
.lang-btn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;cursor:pointer}
.lang-btn:active{background:rgba(255,255,255,.26)}
.lang-btn svg{width:17px;height:17px;flex:0 0 auto}
.lang-btn .cur{font-size:15px}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--paper);color:var(--ink);
  border-radius:14px;box-shadow:0 10px 30px rgba(10,30,18,.28);padding:6px;min-width:172px;border:1px solid var(--line)}
.lang-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;
  min-height:46px;padding:0 12px;border:0;background:transparent;border-radius:10px;font-weight:600;
  cursor:pointer;color:var(--ink);text-align:left}
.lang-menu button:active{background:var(--leaf-l)}
.lang-menu button[aria-checked="true"]{background:var(--leaf-l);color:var(--leaf-d)}
.lang-menu .tick{color:var(--leaf);font-weight:800}
.owner{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:16px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16)}
.avatar{width:52px;height:52px;flex:0 0 auto;border-radius:50%;background:#f0e2c4;color:#7a4a12;
  display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-size:24px;font-weight:700;overflow:hidden;
  border:2px solid rgba(255,255,255,.5)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.owner-name{font-weight:800;font-size:16.5px;line-height:1.35}
.owner-flat{font-size:13.5px;opacity:.85}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:2px;font-size:13px;font-weight:700;
  padding:2px 9px 2px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.dot{width:8px;height:8px;border-radius:50%;background:#54e08a;box-shadow:0 0 0 3px rgba(84,224,138,.28)}
.status.shut .dot{background:#ffb35c;box-shadow:0 0 0 3px rgba(255,179,92,.25)}
.quote{margin:10px 0 0;padding:0 2px;font-size:15.5px;line-height:1.65;opacity:.95}
.quote b{font-weight:700}

/* ---------- visit card (garments-specific) ---------- */
.section{margin-top:22px}
.section h2{font-size:19.5px}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.visit{display:grid;gap:12px}
.visit .addr{font-size:16px;line-height:1.6;margin:0}
.visit .addr b{font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--leaf-l);border:1px solid var(--leaf-line);
  color:var(--leaf-d);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700}
.pill svg{width:16px;height:16px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;min-height:var(--tap);padding:0 18px;font-size:16px;font-weight:800;
  cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:19px;height:19px;flex:0 0 auto}
.btn-ghost{flex:1 1 140px;background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:active{background:var(--leaf-l)}
.btn-go{background:var(--carrot);color:#fff;box-shadow:0 3px 0 var(--carrot-d)}
.btn-go:active{background:var(--carrot-d);box-shadow:0 1px 0 var(--carrot-d);transform:translateY(2px)}

/* ---------- browsing rhythm: tall photo-led cards ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 12px;margin:0 -14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--leaf-d);border-color:var(--leaf-d);color:#fff}
.hint{color:var(--muted);font-size:14px;margin:2px 0 14px}

.rack{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:520px){.rack{grid-template-columns:1fr 1fr;gap:18px}}
.item{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:4/5;background:#f6f1e4;display:block;overflow:hidden}
@media (min-width:520px){.shot{aspect-ratio:3/4}}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.slot{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;
  padding:20px;background:repeating-linear-gradient(135deg,#f7f2e5 0 12px,#f2ecdd 12px 24px);
  border-bottom:1.5px dashed var(--leaf-line)}
.slot svg{width:58px;height:58px;opacity:.55}
.slot b{font-size:14px;font-weight:800;color:var(--muted);line-height:1.4}
.slot code{font-size:11.5px;font-weight:700;color:#8b7a55;background:#fffdf6;border:1px solid #e6dcc2;
  border-radius:7px;padding:3px 7px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;max-width:100%}
.item-body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:10px;flex:1}
.item-nm{font-size:21px;font-weight:700;line-height:1.3}
.item-en{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.2px;margin-top:-6px}
.item-pr{font-size:23px;font-weight:800;color:var(--leaf-d);font-variant-numeric:tabular-nums;line-height:1.2}
.item-pr small{font-size:12.5px;font-weight:600;color:var(--muted)}
.sizes{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sizes .lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.sz{min-width:44px;min-height:36px;display:grid;place-items:center;padding:0 10px;border-radius:9px;
  border:1.5px solid var(--leaf-line);background:var(--leaf-l);color:var(--leaf-d);font-weight:800;font-size:14px;
  font-variant-numeric:tabular-nums}
.ask{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.ask .btn{width:100%}
.asklink{align-self:center;background:none;border:0;color:var(--muted);font-family:inherit;
  font-size:13.5px;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}

/* ---------- picking a size and a quantity ---------- */
.sz{min-width:44px;min-height:40px;padding:0 12px;cursor:pointer;font-family:inherit}
.sz[aria-pressed="true"]{background:var(--leaf-d);border-color:var(--leaf-d);color:#fff}
.sz[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.colors{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.colors .lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.colr{min-height:36px;display:inline-grid;place-items:center;padding:0 11px;border-radius:9px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13.5px;
  font-family:inherit;cursor:pointer}
.colr[aria-pressed="true"]{background:var(--leaf-d);border-color:var(--leaf-d);color:#fff}
.item-note{font-size:13.5px;color:var(--muted);line-height:1.55}
.item-fab{display:inline-block;font-size:12px;font-weight:800;color:var(--leaf-d);background:var(--leaf-l);
  border-radius:999px;padding:3px 10px;letter-spacing:.2px}
.mrp{font-size:15px;font-weight:700;color:var(--muted);text-decoration:line-through;margin-left:7px}
.qtyrow{display:flex;align-items:center;gap:10px}
.qtyrow .lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:11px;overflow:hidden}
.stepper button{width:44px;height:42px;border:0;background:#fff;color:var(--leaf-d);font-size:21px;
  font-weight:800;font-family:inherit;cursor:pointer;line-height:1}
.stepper button:active{background:var(--leaf-l)}
.stepper span{min-width:40px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.item.out{opacity:.62}
.outbadge{display:inline-block;font-size:13px;font-weight:800;color:#8a3b16;background:#fdecdf;
  border:1.5px solid #f0c9a8;border-radius:999px;padding:7px 14px;text-align:center}

/* ---------- bag bar + sheet ---------- */
.bagbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--paper);
  border-top:1.5px solid var(--line);box-shadow:0 -6px 22px rgba(60,40,10,.13);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bagbar .in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bagbar .sum{flex:1;min-width:0;line-height:1.35}
.bagbar .sum b{display:block;font-size:15.5px;font-weight:800}
.bagbar .sum span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.bagbar .btn{flex:0 0 auto;width:auto;padding:0 20px}
body.hasbag{padding-bottom:96px}

/* .sheet sets display:flex, which outranks the browser's [hidden] rule — without
   this an invisible sheet still swallows taps meant for the bag bar under it. */
[hidden]{display:none!important}
.scrim{position:fixed;inset:0;z-index:79;background:rgba(28,18,4,.45)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:80;background:var(--paper);
  border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 -14px 40px rgba(30,20,5,.3)}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 10px;border-bottom:1.5px solid var(--line)}
.sheet-head h3{flex:1;font-size:19px;font-weight:800;margin:0}
.sheet-head .close{width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
.sheet-body{overflow:auto;padding:12px 16px;flex:1}
.sheet-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line);background:#fff}
.line{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line img{width:56px;height:70px;object-fit:cover;border-radius:10px;flex:0 0 auto;background:#eee}
.line .l-nm{flex:1;min-width:0}
.line .l-nm b{display:block;font-size:15.5px;font-weight:700;line-height:1.35}
.line .l-nm small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.line .l-pr{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.line .rm{border:0;background:none;color:var(--carrot);font-family:inherit;font-size:13px;
  font-weight:700;text-decoration:underline;cursor:pointer;padding:4px 0 0}
.totrow{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;font-weight:800;margin-bottom:10px}
.fld{margin-top:12px}
.fld > span{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px}
.fld input,.fld textarea{width:100%;font-family:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);
  border-radius:12px;background:#fff;color:var(--ink)}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--leaf-d);border-color:transparent}
.fld .err{display:block;color:var(--carrot-d);font-size:13px;font-weight:700;margin-top:5px}
.modes{display:flex;gap:9px;margin-top:6px}
.modes button{flex:1;min-height:52px;border:1.5px solid var(--line);background:#fff;border-radius:13px;
  font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;padding:6px 8px;line-height:1.3}
.modes button[aria-pressed="true"]{background:var(--leaf-l);border-color:var(--leaf-d);color:var(--leaf-d)}
.smallnote{font-size:13px;color:var(--muted);line-height:1.6;margin:10px 0 0}
.upi{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.upi h3{font-size:15px;margin:0 0 8px}
.upi-id{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.upi-id code{font:600 15px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--leaf-l);
  color:var(--leaf-d);padding:7px 10px;border-radius:9px}
.upi-copy{min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.upi-note{font-size:13.5px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.btn-upi{display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  margin-top:10px;width:100%;background:#5f259f;color:#fff;border:0;border-radius:14px;
  min-height:52px;padding:10px 14px;text-align:center;text-decoration:none;
  font-family:inherit;font-size:16px;font-weight:700;line-height:1.3;cursor:pointer}
.btn-upi:active{background:#4d1e80}
.paidrow{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:11px 12px;
  border:1.5px solid var(--leaf-line);background:var(--leaf-l);border-radius:12px;cursor:pointer}
.paidrow input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--leaf-d);margin:0}
.paidrow span{font-size:14.5px;font-weight:700;color:var(--leaf-d);line-height:1.45}

.foot{text-align:center;color:var(--muted);font-size:13.5px;margin:30px 0 4px;line-height:1.7}
.crosslink{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:14.5px;font-weight:700}
.crosslink svg{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .btn-go:active{transform:none}
}
@media (max-width:339px){
  .item-nm{font-size:19px}.item-pr{font-size:20px}
}
</style>
</head>
<body>

  <path d="M32 22v5L8 42c-1.8 1.1-1 4 1.2 4h45.6c2.2 0 3-2.9 1.2-4L32 27z" fill="#efe6d0" stroke="#8a7a52" stroke-width="3" stroke-linejoin="round"/>
</symbol>

<header class="hdr">
  <div class="wrap">
    <div class="hdr-top">
      <div class="shop">
        <h1 id="shopName">गुरु आशीष गारमेंट्स</h1>
        <div class="sub" id="shopSub"></div>
      </div>
      <div class="lang">
        <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false">
          <svg aria-hidden="true"><use href="#i-globe"></use></svg>
          <span class="cur" id="langCur">हिं</span>
        </button>
        <div class="lang-menu" id="langMenu" role="menu" hidden></div>
      </div>
    </div>

    <div class="owner">
      <div class="avatar" id="ownerAvatar"></div>
      <div>
        <div class="owner-name" id="ownerName"></div>
        <div class="owner-flat" id="ownerSince"></div>
        <div class="status" id="statusPill"><span class="dot"></span><span id="statusTxt"></span></div>
      </div>
    </div>
    <p class="quote" id="ownerQuote"></p>

  /* ============================ open / closed ============================ */
  function mins(hhmm) {
    var p = String(hhmm || '').split(':');
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }
  function isOpen() {
    var now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    return m >= mins(shop.openTime) && m <= mins(shop.closeTime);
  }
  function pretty(hhmm) {
    var p = String(hhmm || '').split(':'), h = parseInt(p[0], 10) || 0, mm = p[1] || '00';
    var ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + mm + ' ' + ap;
  }
  function paintStatus() {
    var open = isOpen();
    el.statusPill.classList.toggle('shut', !open);
    el.statusTxt.textContent = open
      ? t.openNow + ' · ' + fill(t.hours, { a: pretty(shop.openTime), b: pretty(shop.closeTime) })
      : t.closedNow + ' · ' + fill(t.opensAt, { t: pretty(shop.openTime) });
  }

  /* ============================== catalogue ============================== */
  function renderTabs() {
    var cats = DATA.categories || [];
    el.tabs.innerHTML = '';
    if (cats.length < 2) { el.tabs.hidden = true; return; }
    el.tabs.hidden = false;
    [{ id:'all', label:t.allCat }].concat(cats.map(function (c) {
      return { id: c.id, label: c[lang] || c.en };
    })).forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', c.id === activeCat ? 'true' : 'false');
      b.textContent = c.label;
      b.addEventListener('click', function () { activeCat = c.id; renderTabs(); renderRack(); });
      el.tabs.appendChild(b);
    });
  }

  function pickOf(it) {
    if (!picked[it.id]) {
      var sizes = it.sizes || [];
      picked[it.id] = {
        size: sizes.length === 1 ? sizes[0] : '',
        color: (it.colors || []).length === 1 ? it.colors[0] : '',
        qty: 1
      };
    }
    return picked[it.id];
  }

  function renderRack() {
    el.rack.innerHTML = '';
    items.filter(function (it) { return activeCat === 'all' || it.cat === activeCat; })
      .forEach(function (it) { el.rack.appendChild(card(it)); });
  }

  function card(it) {
    var out = it.available === false;
    var sel = pickOf(it);

    var art = document.createElement('article');
    art.className = 'item' + (out ? ' out' : '');

    var shot = document.createElement('div');
    shot.className = 'shot';
    if (it.photo) {
      var im = document.createElement('img');
      im.src = it.photo; im.alt = name(it); im.loading = 'lazy'; im.decoding = 'async';
      shot.appendChild(im);
    } else {
      shot.innerHTML = '<div class="slot"><svg aria-hidden="true"><use href="#i-hanger"></use></svg>' +
                       '<b>' + esc(name(it)) + '</b></div>';
    }
    art.appendChild(shot);

    var body = document.createElement('div');
    body.className = 'item-body';

    var head = document.createElement('div');
    head.innerHTML = '<div class="item-nm">' + esc(name(it)) + '</div>' +
      (lang === 'en' ? '' : '<div class="item-en">' + esc(it.en || '') + '</div>');
    body.appendChild(head);

    var pr = document.createElement('div');
    pr.className = 'item-pr';
    /* "से" means "from ₹350" — a starting price. Put a struck-through old
       price after it and it reads as a range, ₹350 to ₹450, which is the
       opposite of a discount. So it is one or the other, never both. */
    var cut = it.mrp && Number(it.mrp) > Number(it.price);
    pr.innerHTML = '₹' + it.price +
      (cut ? '<span class="mrp">₹' + it.mrp + '</span>'
           : ' <small>' + esc(t.from) + '</small>');
    body.appendChild(pr);

    if (it.fabric) {
      var fab = document.createElement('div');
      fab.innerHTML = '<span class="item-fab">' + esc(it.fabric) + '</span>';
      body.appendChild(fab);
    }
    if (it.note) {
      var nt = document.createElement('p');
      nt.className = 'item-note'; nt.textContent = it.note;
      body.appendChild(nt);
    }

    /* sizes */
    var sizes = it.sizes || [];
    if (sizes.length) {
      var sr = document.createElement('div');
      sr.className = 'sizes';
      sr.innerHTML = '<span class="lbl">' + esc(t.sizesLbl) + '</span>';
      sizes.forEach(function (sz) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'sz';
        b.setAttribute('aria-pressed', String(sel.size === sz));
        b.textContent = sz;
        b.disabled = out;
        b.addEventListener('click', function () { sel.size = (sel.size === sz ? '' : sz); refresh(it, art); });
        sr.appendChild(b);
      });
      body.appendChild(sr);
    }

    /* colours */
    var colors = it.colors || [];
    if (colors.length) {
      var cr = document.createElement('div');
      cr.className = 'colors';
      cr.innerHTML = '<span class="lbl">' + esc(t.colorsLbl) + '</span>';
      colors.forEach(function (c) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'colr';
        b.setAttribute('aria-pressed', String(sel.color === c));
        b.textContent = c;
        b.disabled = out;
        b.addEventListener('click', function () { sel.color = (sel.color === c ? '' : c); refresh(it, art); });
        cr.appendChild(b);
      });
      body.appendChild(cr);
    }

    var acts = document.createElement('div');
    acts.className = 'ask';

    if (out) {
      var ob = document.createElement('span');
      ob.className = 'outbadge'; ob.textContent = t.soldOut;

      var minus = document.createElement('button');
      minus.type = 'button'; minus.textContent = '−';
      minus.setAttribute('aria-label', t.qtyLbl + ' −');
      minus.addEventListener('click', function () { sel.qty = Math.max(1, sel.qty - 1); refresh(it, art); });
      var num = document.createElement('span'); num.textContent = sel.qty;
      var plus = document.createElement('button');
      plus.type = 'button'; plus.textContent = '+';
      plus.setAttribute('aria-label', t.qtyLbl + ' +');
      plus.addEventListener('click', function () { sel.qty = Math.min(20, sel.qty + 1); refresh(it, art); });
      st.appendChild(minus); st.appendChild(num); st.appendChild(plus);
      qr.appendChild(st);
      acts.appendChild(qr);

      var add = document.createElement('button');
      add.type = 'button'; add.className = 'btn btn-go';
      add.textContent = sizes.length && !sel.size ? t.pickSize : t.bagAdd;
      add.addEventListener('click', function () {
        if (sizes.length && !sel.size) { flashSizes(art); return; }
        addToBag(it, sel);
        add.textContent = t.bagAdded;
        setTimeout(function () { add.textContent = sizes.length && !sel.size ? t.pickSize : t.bagAdd; }, 1400);
      });
      acts.appendChild(add);
    }

    var ask = document.createElement('button');
    ask.type = 'button'; ask.className = 'asklink';
    ask.textContent = t.askMore;
    ask.addEventListener('click', function () { openWA([askLine(it)]); });
    acts.appendChild(ask);

    body.appendChild(acts);
    art.appendChild(body);
    return art;
  }

  /* Redraw one card in place — cheaper than re-rendering the rack and it
     keeps the customer's scroll position exactly where it was. */
  function refresh(it, node) {
    var fresh = card(it);
    node.replaceWith(fresh);
  }

  function flashSizes(node) {
    var row = node.querySelector('.sizes');
    if (!row) return;
    row.scrollIntoView({ block: 'nearest' });
    row.animate
      ? row.animate([{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }], { duration: 480, iterations: 2 })
      : null;
  }

  /* ================================= bag ================================= */
  function itemById(id) {
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }

  function addToBag(it, sel) {
    var same = bag.filter(function (l) {
      return l.id === it.id && l.size === sel.size && l.color === sel.color;
    })[0];
    if (same) same.qty = Math.min(20, same.qty + sel.qty);
    else bag.push({ id: it.id, size: sel.size, color: sel.color, qty: sel.qty });
    save(BAG_KEY, bag);
    paintBag();
  }

  function bagTotal() {
    return bag.reduce(function (sum, l) {
      var it = itemById(l.id);
      return sum + (it ? Number(it.price) * l.qty : 0);
    }, 0);
  }
  function bagCount() {
    return bag.reduce(function (n, l) { return n + l.qty; }, 0);
  }

  function paintBag() {
    /* drop anything whose item has since been removed from the catalogue */
    var before = bag.length;
    bag = bag.filter(function (l) { return itemById(l.id); });
    if (bag.length !== before) save(BAG_KEY, bag);

    var n = bagCount();
    el.bagbar.hidden = n === 0;
    document.body.classList.toggle('hasbag', n > 0);
    if (n) {
      el.bagCount.textContent = n === 1 ? t.bagOne : fill(t.bagMany, { n: n });
      el.bagHint.textContent = fill(t.bagHint, { t: bagTotal() });
      el.bagOpenTxt.textContent = t.bagView;
    }
    paintLines();
  }

  function paintLines() {
    el.bagLines.innerHTML = '';
    if (!bag.length) {
      var e = document.createElement('p');
      e.className = 'smallnote'; e.textContent = t.bagEmpty;
      el.bagLines.appendChild(e);
      el.bagTotal.textContent = '0';
      return;
    }
    bag.forEach(function (l, i) {
      var it = itemById(l.id);
      var row = document.createElement('div');
      row.className = 'line';

      if (it.photo) {
        var im = document.createElement('img');
        im.src = it.photo; im.alt = ''; im.loading = 'lazy';
        row.appendChild(im);
      }

      var bits = [];
      if (l.size) bits.push(t.sizeIs + ' ' + l.size);
      if (l.color) bits.push(l.color);
      bits.push('× ' + l.qty);

      var nm = document.createElement('div');
      nm.className = 'l-nm';
      nm.innerHTML = '<b>' + esc(name(it)) + '</b><small>' + esc(bits.join(' · ')) + '</small>';
      var rm = document.createElement('button');
      rm.type = 'button'; rm.className = 'rm'; rm.textContent = t.removeLbl;
      rm.addEventListener('click', function () {
        bag.splice(i, 1); save(BAG_KEY, bag); paintBag();
      });
      nm.appendChild(rm);
      row.appendChild(nm);

      var pr = document.createElement('div');
      pr.className = 'l-pr';
      pr.textContent = '₹' + (Number(it.price) * l.qty);
      row.appendChild(pr);

      el.bagLines.appendChild(row);
    });
    el.bagTotal.textContent = bagTotal();
    paintUpi();
  }

  /* Same UPI id as the vegetable page. The amount is pre-filled only when the
     customer is collecting, because then the bag total is the whole bill. For
     courier the carriage is not known yet, so pre-filling would name a figure
     that is about to change. */
  function setPayWay(w) {
    payWay = w;
    el.payUpi.setAttribute('aria-pressed', String(w === 'upi'));
    el.payLater.setAttribute('aria-pressed', String(w === 'later'));
    if (w !== 'upi') el.paidChk.checked = false;
    paintUpi();
  }

  function paintUpi() {
    var upi = (shop.upiId || '').trim();
    el.upiBox.hidden = !upi || !bag.length || payWay !== 'upi';
    if (el.upiBox.hidden) { el.shotHint.hidden = true; return; }

    el.upiTtl.textContent   = t.upiTtl;
    el.upiIdTxt.textContent = upi;
    el.upiCopy.textContent  = t.upiCopy;

    var pay = mode === 'shop' ? bagTotal() : 0;
    el.upiPayBtn.textContent = pay ? fill(t.upiPay, { a: pay }) : t.upiPayAny;
    el.upiPayBtn.setAttribute('href', upiLink(pay));
    el.shotHint.hidden = !el.paidChk.checked;
    el.shotHint.textContent = t.shotHint;
    el.upiNote.textContent = mode === 'courier' ? t.upiNoteCourier : t.upiNoteShop;
  }

  function upiLink(amount) {
    var q = 'pa=' + encodeURIComponent(shop.upiId) +
            '&pn=' + encodeURIComponent(shop.upiName || shop.nameEn) +
            '&cu=INR';
    if (amount > 0) q += '&am=' + encodeURIComponent(amount);
    return 'upi://pay?' + q;
  }

  function openSheet() {
    paintLines();
    el.scrim.hidden = false; el.sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    el.sheetClose.focus();
  }
  function closeSheet() {
    el.scrim.hidden = true; el.sheet.hidden = true;
    document.body.style.overflow = '';
  }

  function setMode(m) {
    mode = m;
    el.modeShop.setAttribute('aria-pressed', String(m === 'shop'));
    el.modeCourier.setAttribute('aria-pressed', String(m === 'courier'));
    el.addrWrap.hidden = m !== 'courier';
    el.courierNote.hidden = m !== 'courier';
    /* Courier is paid in advance, and the amount is not known until Tarun has
       weighed the parcel — so there is nothing to choose between yet. The
       courier note above explains what happens instead. */
    el.payChoice.hidden = m === 'courier';
    if (m === 'courier') setPayWayQuiet('later');
    paintUpi();
  }

  function setPayWayQuiet(w) {
    payWay = w;
    el.payUpi.setAttribute('aria-pressed', String(w === 'upi'));
    el.payLater.setAttribute('aria-pressed', String(w === 'later'));
    el.paidChk.checked = false;
  }

  function need(input, err, ok, msg) {
    err.hidden = ok; err.textContent = ok ? '' : msg;
    input.setAttribute('aria-invalid', ok ? 'false' : 'true');
    return ok;
  }

  function sendOrder() {
    var nm = el.gName.value.trim();
    var ph = el.gPhone.value.replace(/\D/g, '');
    var ad = el.gAddr.value.trim();

    var okN = need(el.gName, el.errGName, !!nm, t.needName);
    var okP = need(el.gPhone, el.errGPhone, ph.length === 10, t.needPhone);
    var okA = mode !== 'courier' || need(el.gAddr, el.errGAddr, ad.length >= 12, t.needAddr);
    if (!okN || !okP || !okA) {
      (!okN ? el.gName : !okP ? el.gPhone : el.gAddr).focus();
      return;
    }
    if (!bag.length) return;

    try { save(GINFO_KEY, { name: nm, phone: ph, addr: ad, mode: mode }); } catch (e) {}

    var m = GMSG[lang] || GMSG.hi;
    var lines = ['*' + DATA.shop.nameEn + ' — ' + m.order + '*', ''];
    bag.forEach(function (l, i) {
      var it = itemById(l.id);
      var bits = [it.en || it.hi];
      if (l.size) bits.push(m.size + ' ' + l.size);
      if (l.color) bits.push(l.color);
      lines.push((i + 1) + ') ' + bits.join(' — ') + ' × ' + l.qty +
                 ' — ₹' + (Number(it.price) * l.qty));
    });
    lines.push('', m.total + ': ₹' + bagTotal(), '');
    lines.push(m.name + ': ' + nm);
    lines.push(m.phone + ': ' + ph);
    lines.push(m.how + ': ' + (mode === 'courier' ? m.byCourier : m.atShop));
    if (mode === 'courier') lines.push(m.addr + ': ' + ad);

    /* The page cannot verify a payment — it has no server and never sees the
       bank. So this is the customer's own statement, written in their voice,
       and the screenshot is what Tarun actually checks against PhonePe. */
    if (mode === 'courier') {
      lines.push(m.pay + ': ' + m.courierPay);
    } else if (payWay === 'upi') {
      lines.push(m.pay + ': ' + (el.paidChk.checked ? m.paidUpi : m.willUpi) + ' — ₹' + bagTotal());
      if (el.paidChk.checked) lines.push(m.shot);
    } else {
      lines.push(m.pay + ': ' + m.onDeliv);
    }
    openWA(lines);
  }

  /* Same handoff the vegetable page uses: on a touch device a new tab loses
     the query string when WhatsApp takes over, so navigate directly. */
  function openWA(lines) {
    var url = 'https://wa.me/' + shop.whatsapp + '?text=' + encodeURIComponent(lines.join('\n'));
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (touch) { window.location.href = url; return; }
    var w = null;
    try { w = window.open(url, '_blank'); } catch (e) { w = null; }
    if (w) { try { w.opener = null; } catch (e) {} return; }
    window.location.href = url;
  }

  function askLine(it) {
    return DATA.shop.nameEn + ' — ' + (it.en || it.hi) + ' ke baare mein poochna hai';
  }

  /* ---------------------------- bag wiring ---------------------------- */
  el.bagOpen.addEventListener('click', openSheet);
  el.sheetClose.addEventListener('click', closeSheet);
  el.scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !el.sheet.hidden) closeSheet();
  });
  el.payUpi.addEventListener('click', function () { setPayWay('upi'); });
  el.payLater.addEventListener('click', function () { setPayWay('later'); });
  el.paidChk.addEventListener('change', paintUpi);
  /* Tapping the pay button hands off to a UPI app, so tick the box for them —
     they are unlikely to come back and find it. They can still untick it. */
  el.upiPayBtn.addEventListener('click', function () {
    el.paidChk.checked = true;
    paintUpi();   /* setting .checked in code fires no change event */
  });

  el.modeShop.addEventListener('click', function () { setMode('shop'); });
  el.modeCourier.addEventListener('click', function () { setMode('courier'); });
  el.bagSend.addEventListener('click', sendOrder);
  el.upiCopy.addEventListener('click', function () {
    var id = (shop.upiId || '').trim(), done = function () {
      var old = el.upiCopy.textContent;
      el.upiCopy.textContent = t.upiCopied;
      setTimeout(function () { el.upiCopy.textContent = old; }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(id).then(done, done);
    else done();
  });

  /* Bring back whatever this phone told us last time. */
  (function restore() {
    var info = load(GINFO_KEY, {});
    el.gName.value = info.name || '';
    el.gPhone.value = info.phone || '';
    el.gAddr.value = info.addr || '';
    setMode(info.mode === 'courier' ? 'courier' : 'shop');
    setPayWay('later');
  })();

  /* =============================== helpers =============================== */
  function name(it) { return it[lang] || it.en; }
  function fill(str, vals) {
    return String(str).replace(/\{(\w+)\}/g, function (_, k) {
      return vals[k] === undefined ? '' : vals[k];
    });
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode */ }
  }
})();
</script>
</body>
</html>
