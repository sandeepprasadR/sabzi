<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b1339">
<title>गुरु आशीष वेजिटेबल स्टोर</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{
  --leaf:#14663a; --leaf-d:#0e4d2b; --leaf-l:#e4f0e7; --leaf-line:#c3ddca;
  --brand:#4b1339; --brand-2:#6a1b4d; --marigold:#e8a92c;
  --carrot:#b8480a; --carrot-d:#8f3706;
  --cream:#fdf8ee; --paper:#ffffff; --ink:#1b211c; --muted:#57655a;
  --line:#e3ddcd; --r:18px;
  --shadow:0 1px 2px rgba(27,45,32,.06), 0 6px 18px rgba(27,45,32,.06);
  --tap:52px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16.5px; line-height:1.62; text-wrap:pretty;
  padding-bottom:calc(122px + env(safe-area-inset-bottom));
}
html[lang="bn"] body{font-family:"Noto Sans Bengali","Nirmala UI",system-ui,sans-serif}
html[lang="pa"] body{font-family:"Noto Sans Gurmukhi","Nirmala UI",system-ui,sans-serif}
html[lang="te"] body{font-family:"Noto Sans Telugu","Nirmala UI",system-ui,sans-serif}
html[lang="en"] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button,input,textarea,select{font-family:inherit;font-size:inherit}
a{color:var(--leaf-d);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--carrot)}
:focus-visible{outline:3px solid var(--leaf-d);outline-offset:2px;border-radius:6px}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hdr{background:var(--brand);background-image:linear-gradient(178deg,var(--brand-2),var(--brand));color:#fff;padding:12px 0 0;position:relative}
.hdr:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--cream);
  border-radius:16px 16px 0 0;border-top:3px solid var(--marigold)}
.hdr-top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.shop{min-width:0}
.shop h1{font-family:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif;font-size:23px;font-weight:700;letter-spacing:.2px;line-height:1.24}
.shop .sub{font-size:12.5px;opacity:.82;font-weight:500;letter-spacing:.3px;text-transform:uppercase}

/* language control */
.lang{position:relative;flex:0 0 auto}
.lang-btn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;cursor:pointer}
.lang-btn:active{background:rgba(255,255,255,.26)}
.lang-btn svg{width:17px;height:17px;flex:0 0 auto}
.lang-btn .cur{font-size:15px}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--paper);color:var(--ink);
  border-radius:14px;box-shadow:0 10px 30px rgba(10,30,18,.28);padding:6px;min-width:172px;border:1px solid var(--line)}
.lang-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;
  min-height:46px;padding:0 12px;border:0;background:transparent;border-radius:10px;font-weight:600;
  cursor:pointer;color:var(--ink);text-align:left}
.lang-menu button:active{background:var(--leaf-l)}
.lang-menu button[aria-checked="true"]{background:var(--leaf-l);color:var(--leaf-d)}
.lang-menu .tick{color:var(--leaf);font-weight:800}

/* owner card */
.owner{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:16px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16)}
.avatar{width:52px;height:52px;flex:0 0 auto;border-radius:50%;background:#f0e2c4;color:#7a4a12;
  display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-size:24px;font-weight:700;overflow:hidden;
  border:2px solid rgba(255,255,255,.5)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.owner-txt{min-width:0}
.owner-name{font-weight:800;font-size:16.5px;line-height:1.35}
.owner-flat{font-size:13.5px;opacity:.85}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:2px;font-size:13px;font-weight:700;
  padding:2px 9px 2px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.dot{width:8px;height:8px;border-radius:50%;background:#54e08a;box-shadow:0 0 0 3px rgba(84,224,138,.28)}
.status.shut .dot{background:#ffb35c;box-shadow:0 0 0 3px rgba(255,179,92,.25)}
.quote{margin:10px 0 0;padding:0 2px;font-size:15.5px;line-height:1.65;opacity:.95}
.quote b{font-weight:700}

.perks{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0 0;padding:0 0 20px}
.perks li{background:rgba(255,255,255,.12);border-radius:12px;padding:9px 7px;font-size:11.5px;
  line-height:1.4;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center}
.perks li b{font-size:13.5px;font-weight:800;line-height:1.3}
.perks li svg{width:20px;height:20px;opacity:.9}

/* ---------- catalogue ---------- */
.section{margin-top:24px}
.section h2{font-size:19.5px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.updated{font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:2px 0 12px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--leaf-d);border-color:var(--leaf-d);color:#fff}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 11px 11px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.card.on{border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-l),var(--shadow)}
.art{width:76px;height:76px;display:block}
.shotwrap{margin:-12px -11px 0;width:calc(100% + 22px);aspect-ratio:4/3;overflow:hidden;
  background:#f6f1e4;border-radius:16px 16px 0 0;position:relative}
.shotwrap img{width:100%;height:100%;object-fit:cover;display:block}
.photobtn{margin-top:9px;width:100%;min-height:44px;border:1.5px dashed var(--leaf-line);border-radius:11px;
  background:#fffdf6;color:var(--leaf-d);font-weight:700;font-size:13.5px;cursor:pointer;
  display:none;align-items:center;justify-content:center;gap:7px}
.photobtn svg{width:16px;height:16px}
.photobtn:active{background:var(--leaf-l)}
body.photomode .photobtn{display:flex}
.photorm{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:999px;border:0;
  background:rgba(255,255,255,.92);color:#8f1d16;font-size:15px;font-weight:800;cursor:pointer;display:none;
  place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
body.photomode .photorm{display:grid}
.photobar{background:#fff6e6;border:1.5px solid #f0d69c;border-radius:14px;padding:12px 14px;margin:0 0 14px;
  font-size:13.5px;line-height:1.55;color:#7a4a06;font-weight:600;display:none}
body.photomode .photobar{display:block}
.phototoggle{background:none;border:0;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;padding:6px 4px;min-height:34px}
.card .nm{font-weight:700;font-size:19px;line-height:1.35;margin-top:6px}
.card .en{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px;line-height:1.3;margin-top:1px}
.card .pr{margin-top:7px;font-size:20px;font-weight:800;color:var(--leaf-d);font-variant-numeric:tabular-nums}
.card .pr small{font-size:12px;font-weight:600;color:var(--muted)}
.ctrl{margin-top:11px;width:100%}
.add{width:100%;min-height:var(--tap);border:0;border-radius:13px;background:var(--leaf);color:#fff;
  font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.add:active{background:var(--leaf-d)}
.stepper{width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--leaf-l);border:1.5px solid var(--leaf-line);border-radius:13px;padding:3px}
.stepper button{width:46px;height:46px;flex:0 0 auto;border:0;border-radius:10px;background:var(--leaf);
  color:#fff;font-size:24px;font-weight:700;line-height:1;cursor:pointer;display:grid;place-items:center}
.stepper button:active{background:var(--leaf-d)}
.stepper .q{font-weight:800;font-size:15px;color:var(--leaf-d);padding:0 2px;font-variant-numeric:tabular-nums;
  line-height:1.25;min-width:0}

/* ---------- form ---------- */
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.fields{display:grid;gap:14px;margin-top:12px}
.fld{display:grid;gap:6px}
.fld>.lbl{font-size:15px;font-weight:700;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;line-height:1.4}
.fld>.lbl em{font-style:normal;color:var(--muted);font-weight:600;font-size:12.5px}
input,textarea{font-size:17px;padding:14px 14px;border:1.5px solid var(--line);border-radius:13px;
  background:#fffdf8;color:var(--ink);width:100%;min-height:var(--tap)}
input::placeholder,textarea::placeholder{color:#8d998f}
input:focus,textarea:focus{outline:3px solid var(--leaf-d);outline-offset:1px;border-color:var(--leaf)}
input.bad,textarea.bad{border-color:#b3261e;background:#fff6f5}
.errmsg{color:#8f1d16;font-size:14px;font-weight:700;display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.errmsg svg{width:17px;height:17px;flex:0 0 auto;margin-top:3px}

.row2{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;min-height:var(--tap);padding:0 18px;font-size:16px;font-weight:800;
  cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:19px;height:19px;flex:0 0 auto}
.btn-ghost{flex:1 1 130px;background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:active{background:var(--leaf-l)}
.btn-go{background:var(--carrot);color:#fff;box-shadow:0 3px 0 var(--carrot-d)}
.btn-go:active{background:var(--carrot-d);box-shadow:0 1px 0 var(--carrot-d);transform:translateY(2px)}
.btn-go[data-idle="1"]{background:#e9e2d2;color:#6c7568;box-shadow:none}
.addr{color:var(--muted);font-size:14.5px;margin:6px 0 0}
/* ---- UPI + support ---- */
.upi{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.upi h3{font-size:15px;margin:0 0 8px}
.upi-id{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.upi-id code{font:600 15px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--leaf-l);
  color:var(--leaf-d);padding:7px 10px;border-radius:9px}
.upi-copy{min-height:44px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;
  font:600 14px/1 inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.upi-note{font-size:13.5px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.btn-upi{display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  margin-top:10px;width:100%;background:#5f259f;color:#fff;border:0;border-radius:14px;
  min-height:52px;padding:10px 14px;text-align:center;text-decoration:none;
  font-family:inherit;font-size:16px;font-weight:700;line-height:1.3;cursor:pointer}
.btn-upi:active{background:#4d1e80}
.helprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.helprow .btn{width:100%}
.promise{margin:14px 0 0;padding:12px 14px;background:var(--leaf-l);border-radius:12px}
.promise h3{font-size:14px;margin:0 0 8px;color:var(--leaf-d)}
.promise ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink);line-height:1.75}
.promise li{margin-bottom:3px}
.dlg{position:fixed;inset:auto 0 0 0;z-index:80;background:var(--paper);border-radius:22px 22px 0 0;
  max-height:82vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 34px rgba(0,0,0,.22)}
.dlg h3{margin:0 0 4px;font-size:19px}
.dlg .lead{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.6}
.dlg .close{position:absolute;right:14px;top:14px;width:36px;height:36px;border:0;border-radius:999px;
  background:var(--leaf-l);color:var(--leaf-d);font-size:16px;cursor:pointer}
.opts{display:grid;gap:8px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:1.5px solid var(--line);
  background:#fff;border-radius:13px;font:600 15px/1.3 inherit;font-family:inherit;color:var(--ink);
  cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-l);color:var(--leaf-d)}
.opt .em{font-size:20px}
.dlg textarea{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;background:#fff;color:var(--ink);box-sizing:border-box}
.card.gone{opacity:.62}
.card.gone .pr{color:var(--muted)}
.soldout{display:block;width:100%;margin-top:10px;padding:11px 8px;border-radius:11px;
  background:#f0eeea;color:#7a6f64;font-weight:700;font-size:13.5px;text-align:center;line-height:1.35}
.copyrow{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.copyrow p{margin:0 0 8px;font-size:13px;color:var(--muted);line-height:1.55}
.rev-sum{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.rev-avg{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.rev-meta{flex:1;min-width:0}
.stars{display:inline-flex;gap:2px;line-height:1}
.stars svg{width:17px;height:17px;fill:#e0b400}
.stars svg.off{fill:var(--line)}
.rev-count{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.rev-list{display:grid;gap:10px}
.rev{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff}
.rev.feat{border-color:var(--leaf);background:var(--leaf-l)}
.rev-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rev-who{font-weight:700;font-size:14.5px}
.rev-flat{font-size:12.5px;color:var(--muted)}
.rev-txt{margin:6px 0 0;font-size:14.5px;line-height:1.6}
.starpick{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.starpick button{background:none;border:0;padding:6px;cursor:pointer;line-height:0}
.starpick svg{width:38px;height:38px;fill:var(--line);transition:fill .12s}
.starpick button[aria-checked="true"] svg,
.starpick button.lit svg{fill:#e0b400}
@media (prefers-reduced-motion:reduce){.starpick svg{transition:none}}
.hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important}
.foot{text-align:center;color:var(--muted);font-size:13.5px;margin:28px 0 6px;line-height:1.7}
.crosslink{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:14.5px;font-weight:700}
.crosslink svg{width:16px;height:16px}

/* ---------- cart bar ---------- */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);
  border-top:1.5px solid var(--line);box-shadow:0 -6px 22px rgba(20,60,35,.13);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.cartbar-in{max-width:660px;margin:0 auto;display:flex;gap:11px;align-items:center}
.cart-sum{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;background:transparent;border:0;
  cursor:pointer;color:var(--ink);text-align:left;padding:4px 0;min-height:48px}
.cart-count{background:var(--leaf);color:#fff;min-width:30px;height:30px;border-radius:999px;display:grid;
  place-items:center;font-size:15px;font-weight:800;padding:0 8px;flex:0 0 auto}
.cart-txt{min-width:0}
.cart-lead{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;line-height:1.3}
.cart-amt{font-size:23px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--leaf-d)}
.cart-empty{font-size:15px;font-weight:700;color:var(--muted);line-height:1.35}
.chev{color:var(--muted);font-size:12px;flex:0 0 auto}
.cartbar .btn-go{flex:0 0 auto;max-width:56%}
.cartbar[data-empty="1"] .btn-go{opacity:1}
.mintrack{max-width:660px;margin:0 auto 7px;display:flex;align-items:center;gap:8px;font-size:12.5px;
  font-weight:700;color:var(--carrot-d)}
.mintrack .bar{flex:1;height:7px;border-radius:99px;background:#eee6d6;overflow:hidden}
.mintrack .fill{height:100%;background:var(--carrot);border-radius:99px;transition:width .25s ease}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,32,19,.5);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--cream);
  border-radius:22px 22px 0 0;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 -10px 34px rgba(0,0,0,.24);animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px}
.sheet-hd h3{font-size:20px}
.sheet-hd .sub{font-size:13px;color:var(--muted);font-weight:600}
.close{border:1.5px solid var(--line);background:var(--paper);width:44px;height:44px;flex:0 0 auto;border-radius:999px;
  font-size:17px;cursor:pointer;color:var(--ink);display:grid;place-items:center}
.sheet-body{overflow:auto;padding:0 16px;-webkit-overflow-scrolling:touch}
.oline{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.oline .art{width:44px;height:44px;flex:0 0 auto}
.oline .who{flex:1 1 auto;min-width:0}
.oline .who b{display:block;font-size:16.5px;font-weight:700;line-height:1.35}
.oline .who span{font-size:12.5px;color:var(--muted);font-weight:600}
.oline .mini{display:flex;align-items:center;gap:2px;background:var(--paper);border:1.5px solid var(--leaf-line);
  border-radius:11px;padding:2px;flex:0 0 auto}
.oline .mini button{width:40px;height:40px;border:0;background:var(--leaf-l);color:var(--leaf-d);border-radius:8px;
  font-size:21px;font-weight:800;line-height:1;cursor:pointer}
.oline .mini button:active{background:var(--leaf-line)}
.oline .mini span{min-width:66px;text-align:center;font-size:13.5px;font-weight:800;color:var(--leaf-d);
  font-variant-numeric:tabular-nums;line-height:1.2}
.oline .amt{flex:0 0 auto;font-size:16.5px;font-weight:800;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.sheet-ft{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line);
  background:var(--paper);display:grid;gap:11px}
.totrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.totrow .k{font-size:15px;font-weight:700;color:var(--muted)}
.totrow .v{font-size:27px;font-weight:800;color:var(--leaf-d);font-variant-numeric:tabular-nums}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--muted);font-weight:600}
.note svg{width:17px;height:17px;flex:0 0 auto;margin-top:3px}

.sheet-ft .btn-go{width:100%;min-height:58px;font-size:18px}

.empty{background:var(--paper);border:1.5px dashed var(--leaf-line);border-radius:var(--r);

.empty b{font-size:17.5px;font-weight:800;line-height:1.4}
.empty p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.55;max-width:34ch}
.empty .btn{margin-top:6px}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .btn-go:active{transform:none}
}
@media (max-width:339px){

  .cart-amt{font-size:20px}.cartbar .btn-go{font-size:15px;padding:0 12px}
  .perks{grid-template-columns:1fr 1fr}.perks li:last-child{grid-column:span 2}
}

  /* ============================ language ================================= */
  function buildLangMenu() {
    LANGS.forEach(function (L) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'menuitemradio');
      b.innerHTML = '<span>' + L.label + '</span><span class="tick"></span>';
      b.addEventListener('click', function () { setLang(L.code); closeLangMenu(); });
      b.dataset.code = L.code;
      el.langMenu.appendChild(b);
    });
    el.langBtn.addEventListener('click', function () {
      if (el.langMenu.hidden) {
        el.langMenu.hidden = false; el.langBtn.setAttribute('aria-expanded', 'true');
      } else closeLangMenu();
    });
    document.addEventListener('click', function (e) {
      if (!el.langMenu.hidden && !e.target.closest('.lang')) closeLangMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!el.langMenu.hidden) closeLangMenu();
      else if (!el.sheet.hidden) closeSheet();
    });
  }
  function closeLangMenu() {
    el.langMenu.hidden = true; el.langBtn.setAttribute('aria-expanded', 'false');
  }
  function setLang(code) {
    if (!T[code]) return;
    lang = code; t = T[code]; save(LANG_KEY, code);
    applyLang(); renderTabs(); renderGrid(); renderCart();
  }
  function loadFont(name) {
    if (!name) return;
    var href = 'https://fonts.googleapis.com/css2?family=' + name + ':wght@400;500;600;700;800&display=swap';
    if (document.querySelector('link[href="' + href + '"]')) return;
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = href;
    document.head.appendChild(l);
  }

  function applyLang() {
    var L = LANGS.filter(function (x) { return x.code === lang; })[0];
    loadFont(L.font);
    document.documentElement.lang = lang;
    el.langCur.textContent = L.short;
    el.langBtn.setAttribute('aria-label', t.chooseLang);
    Array.prototype.forEach.call(el.langMenu.children, function (b) {
      var on = b.dataset.code === lang;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.querySelector('.tick').textContent = on ? '✓' : '';
    });

    el.shopName.textContent = lang === 'en' ? store.nameEn : store.name;
    el.shopSub.textContent = t.sub;
    document.title = (lang === 'en' ? store.nameEn : store.name);

    el.ownerName.textContent = lang === 'en' ? store.ownerNameEn : store.ownerName;
    el.ownerFlat.textContent = t.ownerFlatLbl + ' ' + store.ownerFlat;
    el.ownerAvatar.innerHTML = store.ownerPhoto
      ? '<img src="' + store.ownerPhoto + '" alt="">'
      : (lang === 'en' ? store.ownerNameEn : store.ownerName).charAt(0);
    /* blank quote hides the line entirely rather than leaving a gap */
    el.ownerQuote.innerHTML = t.quote || '';
    el.ownerQuote.hidden = !(t.quote && t.quote.trim());

    set('perk1b', fill(t.perk1b, { m: store.deliveryMinutes }));
    set('perk1a', t.perk1a);
    set('perk2b', t.perk2b); set('perk2a', t.perk2a);
    set('perk3b', t.perk3b); set('perk3a', t.perk3a);

    set('ttlRates', t.ttlRates); set('ratesHint', t.ratesHint);
    el.updatedOn.textContent = store.updatedOn ? fill(t.updated, { d: formatDate(store.updatedOn) }) : '';

    set('ttlYou', t.ttlYou);
    set('lblName', t.lblName); set('lblFlat', t.lblFlat);
    set('lblPhone', t.lblPhone); set('lblNote', t.lblNote);
    hideEn(lang === 'en');
    el.fName.placeholder = t.phName; el.fFlat.placeholder = t.phFlat;
    el.fPhone.placeholder = t.phPhone; el.fNote.placeholder = t.phNote;
    el.errName.querySelector('span').textContent = t.errName;
    el.errFlat.querySelector('span').textContent = t.errFlat;

    set('ttlContact', t.ttlContact); set('btnCall', t.btnCall); set('btnWa', t.btnWa);
    el.storeAddress.textContent = (lang === 'en' ? store.addressEn : store.address) + ' · ' + store.phone;

  function set(id, text) { var n = document.getElementById(id); if (n) n.textContent = text; }
  function hideEn(hide) {
    ['lblNameEn','lblFlatEn','lblPhoneEn','lblNoteEn'].forEach(function (id) {
      document.getElementById(id).style.display = hide ? 'none' : '';

  /* ============================ open / closed ============================ */
  function mins(hhmm) {
    var p = String(hhmm || '').split(':');
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }
  function isOpen() {
    var now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    return m >= mins(store.openTime) && m <= mins(store.lastOrderTime);
  }
  function pretty(hhmm) {
    var p = String(hhmm || '').split(':'), h = parseInt(p[0], 10) || 0, mm = p[1] || '00';
    var ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + mm + ' ' + ap;
  }
  function paintStatus() {
    var open = isOpen();
    el.statusPill.classList.toggle('shut', !open);
    el.statusTxt.textContent = open
      ? t.openNow + ' · ' + fill(t.lastOrder, { t: pretty(store.lastOrderTime) })
      : t.closedNow + ' · ' + fill(t.opensAt, { t: pretty(store.openTime) });
  }

  /* ============================== catalogue ============================== */
  function renderTabs() {
    var cats = DATA.categories || [];
    el.tabs.innerHTML = '';
    if (cats.length < 2) { el.tabs.hidden = true; return; }
    el.tabs.hidden = false;
    var all = [{ id: 'all', label: t.allCat }].concat(cats.map(function (c) {
      return { id: c.id, label: c[lang] || c.en };
    }));
    all.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', c.id === activeCat ? 'true' : 'false');
      b.textContent = c.label;
      b.addEventListener('click', function () { activeCat = c.id; renderTabs(); renderGrid(); });
      el.tabs.appendChild(b);
    });
  }

  function visible() {
    return products.filter(function (p) { return activeCat === 'all' || p.cat === activeCat; });
  }

  function renderGrid() {
    el.grid.innerHTML = '';
    visible().forEach(function (p) {
      var card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + p.id;
      var src = photoFor(p);
      card.innerHTML =
        (src
          ? '<div class="shotwrap"><img src="' + esc(src) + '" alt="" loading="lazy" decoding="async">' +
            '<button class="photorm" type="button" data-rm="' + p.id + '" aria-label="' + esc(t.photoRm) + '">✕</button></div>'
          : '<svg class="art" aria-hidden="true"><use href="#v-' + p.art + '"></use></svg>') +
        '<div class="nm">' + esc(name(p)) + '</div>' +
        (lang === 'en' ? '' : '<div class="en">' + esc(p.en) + '</div>') +
        '<div class="pr">₹' + p.price + ' <small>' + t.per + ' ' + unitLabel(p.unit) + '</small></div>' +
        '<div class="ctrl"></div>';
      if (p.available === false) card.classList.add('gone');
      el.grid.appendChild(card);
      addPhotoBtn(card, p, !!src);
      renderControl(p);
    });
  }

  function renderControl(p) {
    var card = document.getElementById('card-' + p.id);
    if (!card) return;
    var slot = card.querySelector('.ctrl');
    var qty = cart[p.id] || 0;
    slot.innerHTML = '';
    card.classList.toggle('on', qty > 0);

    /* out of stock today: show it, but keep the item visible so people
       know it exists and is coming back */
    if (p.available === false) {
      var out = document.createElement('span');
      out.className = 'soldout';
      out.textContent = t.soldOut;
      slot.appendChild(out);
      return;
    }

    if (qty <= 0) {
      var add = document.createElement('button');
      add.className = 'add'; add.type = 'button';
      add.innerHTML = '<svg aria-hidden="true" style="width:17px;height:17px"><use href="#i-plus"></use></svg>' + esc(t.add);
      add.setAttribute('aria-label', t.add + ' — ' + name(p));
      add.addEventListener('click', function () { change(p, p.step); });
      slot.appendChild(add);
      return;
    }
    slot.appendChild(stepper(p, qty, 'stepper', 'q'));
  }

  function stepper(p, qty, boxClass, qClass) {
    var box = document.createElement('div');
    box.className = boxClass;
    var minus = document.createElement('button');
    minus.type = 'button'; minus.textContent = '−';
    minus.setAttribute('aria-label', name(p) + ' ' + t.less);
    minus.addEventListener('click', function () { change(p, -p.step); });
    var label = document.createElement('span');
    label.className = qClass;
    label.setAttribute('aria-live', 'polite');
    label.textContent = qtyLabel(p, qty);
    var plus = document.createElement('button');
    plus.type = 'button'; plus.textContent = '+';
    plus.setAttribute('aria-label', name(p) + ' ' + t.more);
    plus.addEventListener('click', function () { change(p, p.step); });
    box.appendChild(minus); box.appendChild(label); box.appendChild(plus);
    return box;
  }

  /* cart logic — unchanged from the original */
  function change(p, delta) {
    var qty = round2((cart[p.id] || 0) + delta);
    if (qty <= 0) delete cart[p.id];
    else cart[p.id] = qty;
    save(CART_KEY, cart);
    renderControl(p);
    renderCart();
  }

  function cartLines() {
    return products
      .filter(function (p) { return cart[p.id] > 0; })
      .map(function (p) {
        var qty = cart[p.id];
        return { p: p, qty: qty, amount: round2(qty * p.price) };
      });
  }

  function renderCart() {
    var lines = cartLines();
    var total = lines.reduce(function (s, l) { return s + l.amount; }, 0);
    var count = lines.length;
    var empty = count === 0;

    el.cartbar.dataset.empty = empty ? '1' : '0';
    el.cartCount.hidden = empty; el.chev.hidden = empty;
    el.cartFull.hidden = empty; el.cartEmptyTxt.hidden = !empty;
    el.cartEmptyTxt.textContent = t.cartEmpty;
    el.cartCount.textContent = String(count);
    el.cartLead.textContent = t.cartLead;
    el.cartTotal.textContent = fmt(total);
    el.sheetTotal.textContent = fmt(total);
    el.btnSend.textContent = empty ? t.review : t.send;
    el.sendOrder.dataset.idle = empty ? '1' : '0';
    el.sheetSub.textContent = fill(t.sheetSub, { n: count });

    /* minimum-order progress (only when store.minOrder > 0) */
    var min = Number(store.minOrder) || 0;
    if (min > 0 && !empty) {
      el.minTrack.hidden = false;
      var short = round2(min - total);
      el.minTxt.textContent = short > 0 ? fill(t.minLeft, { n: fmt(short) }) : t.minOk;
      el.minFill.style.width = Math.min(100, (total / min) * 100) + '%';
    } else el.minTrack.hidden = true;

    /* sheet body: lines, or the empty state */
    el.sheetBody.innerHTML = '';
    if (empty) {
      var box = document.createElement('div');
      box.className = 'empty';
      box.style.margin = '4px 0 16px';
      box.innerHTML =
        '<svg aria-hidden="true"><use href="#i-basket"></use></svg>' +
        '<b>' + esc(t.emptyTitle) + '</b><p>' + esc(t.emptyBody) + '</p>';
      var cta = document.createElement('button');
      cta.className = 'btn btn-ghost'; cta.type = 'button';
      cta.textContent = t.emptyCta;
      cta.addEventListener('click', function () {
        closeSheet();
        window.scrollTo({ top: Math.max(0, document.getElementById('catalogue').offsetTop - 12), behavior: 'smooth' });
      });
      box.appendChild(cta);
      el.sheetBody.appendChild(box);
    } else {
      lines.forEach(function (l) {
        var row = document.createElement('div');
        row.className = 'oline';
        row.innerHTML =
          (photoFor(l.p)
            ? '<img class="art" style="border-radius:9px;object-fit:cover" src="' + esc(photoFor(l.p)) + '" alt="">'
            : '<svg class="art" aria-hidden="true"><use href="#v-' + l.p.art + '"></use></svg>') +
          '<span class="who"><b>' + esc(name(l.p)) + '</b>' +
          (lang === 'en' ? '' : '<span>' + esc(l.p.en) + '</span>') + '</span>';
        row.appendChild(stepper(l.p, l.qty, 'mini', ''));
        var amt = document.createElement('span');
        amt.className = 'amt'; amt.textContent = '₹' + fmt(l.amount);
        row.appendChild(amt);
        el.sheetBody.appendChild(row);
      });
    }

    var open = isOpen();
    el.sheetWarn.hidden = open;
    if (!open) el.sheetWarn.textContent = fill(t.warnClosed, { t: pretty(store.openTime) });
    el.sheetNote.querySelector('span').textContent = fill(t.sheetNote, { m: store.deliveryMinutes });
    el.sheetSend.disabled = empty;
    el.sheetSend.dataset.idle = empty ? '1' : '0';
  }

  /* =============================== order ================================= */
  /* ---------------------------------------------------------------------
     Opening WhatsApp.

     window.open(url, '_blank', 'noopener') asks for a *popup window*, and
     mobile Safari and Chrome block that by default — the tap appeared to
     do nothing at all on a phone. Open a plain tab instead, and if the
     browser still refuses, navigate this tab; the cart is in localStorage,
     so coming back loses nothing.
     --------------------------------------------------------------------- */
  var lastMsg = '';

  /* ---------------------------------------------------------------------
     Opening WhatsApp.

     Two separate problems were hit here, in order:

     1. window.open(url, '_blank', 'noopener') asks for a *popup window*.
        Mobile Safari and Chrome block popups and return null silently, so
        the tap did nothing at all.

     2. Opening a new tab instead did launch WhatsApp, but the app received
        only the phone number and showed an empty message box. The wa.me
        redirect hands off to the app, and on Android that hand-off loses
        the query string when it starts from a freshly-opened tab.

     So on a touch device navigate this tab directly — a top-level
     navigation carries the whole URL into the app. Desktop keeps the new
     tab, since there WhatsApp Web opens fine and we would rather not throw
     away the shop page.
     --------------------------------------------------------------------- */
  function openWA(lines) {
    lastMsg = lines.join('\n');
    var url = 'https://wa.me/' + store.whatsapp + '?text=' +
              encodeURIComponent(lastMsg);
    showCopyFallback();

    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (touch) { window.location.href = url; return; }

    var w = null;
    try { w = window.open(url, '_blank'); } catch (e) { w = null; }
    if (w) { try { w.opener = null; } catch (e) {} return; }
    window.location.href = url;
  }

  /* If WhatsApp still opens with an empty box, the order is not lost: this
     row appears in the sheet so it can be copied and pasted into the chat. */
  function showCopyFallback() {
    if (!el.copyRow) return;
    el.copyRow.hidden = false;
    el.copyHint.textContent = t.copyHint;
    el.copyBtn.textContent = t.copyBtn;
  }

  function trySend() {
    var lines = cartLines();
    if (!lines.length) { openSheet(); return; }

    var name_ = el.fName.value.trim();
    var flat = el.fFlat.value.trim();
    var phone = el.fPhone.value.replace(/\D/g, '');

    var okFlat = requireField(el.fFlat, el.errFlat, flat);
    var okName = requireField(el.fName, el.errName, name_);
    if (!okName || !okFlat) {
      closeSheet();
      var target = !okName ? el.fName : el.fFlat;
      window.scrollTo({
        top: Math.max(0, document.getElementById('orderForm').offsetTop - 16),
        behavior: 'smooth'
      });
      setTimeout(function () { try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); } }, 350);
      return;
    }

    var min = Number(store.minOrder) || 0;
    var total = lines.reduce(function (s, l) { return s + l.amount; }, 0);
    if (min > 0 && total < min) {
      openSheet();
      el.sheetWarn.hidden = false;
      el.sheetWarn.textContent = fill(t.minBlock, { n: fmt(min) });
      return;
    }

    saveInfo();

    /* WhatsApp message — same shape as before; only the labels follow the
       chosen language. Quantities, flat and totals stay Hindi/English with
       Western numerals so Tarun can read any order at a glance. */
    var m = MSG[lang] || MSG.hi;
    var msg = ['*' + store.name + '* — ' + m.neworder, ''];
    lines.forEach(function (l, i) {
      msg.push((i + 1) + '. ' + l.p.emoji + ' ' + l.p.hi + ' — ' +
        qtyLabelHi(l.p, l.qty) + ' = ₹' + fmt(l.amount));
    });
    msg.push('', '*' + m.total + ': ₹' + fmt(total) + '*', '');
    msg.push(m.name + ': ' + name_);
    msg.push(m.flat + ': ' + flat);
    if (phone) msg.push(m.mobile + ': ' + phone);
    var note = el.fNote.value.trim();
    if (note) msg.push(m.note + ': ' + note);

    openWA(msg);
  }
  el.sendOrder.addEventListener('click', trySend);
  el.sheetSend.addEventListener('click', trySend);

  function requireField(node, errNode, value) {
    var ok = value.length > 0;
    node.classList.toggle('bad', !ok);
    node.setAttribute('aria-invalid', ok ? 'false' : 'true');
    errNode.hidden = ok;
    return ok;
  }

  /* ================================ sheet ================================ */
  el.cartToggle.addEventListener('click', function () {
    if (el.sheet.hidden) openSheet(); else closeSheet();
  });
  el.sheetClose.addEventListener('click', closeSheet);
  el.scrim.addEventListener('click', closeSheet);

  function openSheet() {
    el.sheet.hidden = false; el.scrim.hidden = false;
    el.cartToggle.setAttribute('aria-expanded', 'true');
    el.sheetClose.focus();
  }
  function closeSheet() {
    el.sheet.hidden = true; el.scrim.hidden = true;
    el.cartToggle.setAttribute('aria-expanded', 'false');
  }

  /* ===================== customer info persistence ======================= */
  function restoreInfo() {
    el.fName.value = info.name || '';
    el.fFlat.value = info.flat || '';
    el.fPhone.value = info.phone || '';
    [el.fName, el.fFlat, el.fPhone].forEach(function (n) {
      n.addEventListener('input', function () {
        n.classList.remove('bad');
        n.setAttribute('aria-invalid', 'false');
        if (n === el.fName) el.errName.hidden = true;
        if (n === el.fFlat) el.errFlat.hidden = true;
      });
      n.addEventListener('change', saveInfo);
    });
    el.fNote.addEventListener('change', saveInfo);
  }
  function saveInfo() {
    save(INFO_KEY, {
      name: el.fName.value.trim(),
      flat: el.fFlat.value.trim(),
      phone: el.fPhone.value.trim()
    });
  }

  /* ============================== photos ================================= */
  function photoFor(p) { return photos[p.id] || p.photo || ''; }

  el.photoToggle.addEventListener('click', function () {
    photoMode = !photoMode;
    document.body.classList.toggle('photomode', photoMode);
    el.photoToggle.setAttribute('aria-pressed', photoMode ? 'true' : 'false');
    el.photoToggle.textContent = photoMode ? t.photoOff : t.photoOn;
    if (photoMode) window.scrollTo({ top: Math.max(0, el.photoBar.offsetTop - 60), behavior: 'smooth' });
  });

  function addPhotoBtn(card, p, has) {
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'photobtn';
    btn.innerHTML = '<svg aria-hidden="true"><use href="#i-cam"></use></svg>' +
      esc(has ? t.photoChange : t.photoAdd);
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.hidden = true;
    inp.addEventListener('change', function () {
      if (inp.files && inp.files[0]) takePhoto(p, inp.files[0]);
      inp.value = '';
    });
    btn.addEventListener('click', function () { inp.click(); });
    card.appendChild(btn); card.appendChild(inp);
    var rm = card.querySelector('[data-rm]');
    if (rm) rm.addEventListener('click', function () {
      delete photos[p.id]; save(PHOTO_KEY, photos); renderGrid(); renderCart();
    });
  }

  /* Shrunk on the device and kept in localStorage — nothing is uploaded anywhere. */
  function takePhoto(p, file) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        if (!keep(p, shrink(img, 360, 0.72)) && !keep(p, shrink(img, 240, 0.5))) {
          el.photoBar.textContent = t.photoBig; return;
        }
        el.photoBar.textContent = t.photoNote;
        renderGrid(); renderCart();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  function shrink(img, max, q) {
    var w = img.naturalWidth || img.width, hh = img.naturalHeight || img.height;
    var cw = Math.min(w, hh * 4 / 3), ch = cw * 3 / 4;   /* centre-crop to 4:3 */
    var c = document.createElement('canvas');
    c.width = max; c.height = Math.round(max * 0.75);
    c.getContext('2d').drawImage(img, (w - cw) / 2, (hh - ch) / 2, cw, ch, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  }
  function keep(p, dataUrl) {
    var prev = photos[p.id];
    photos[p.id] = dataUrl;
    try { localStorage.setItem(PHOTO_KEY, JSON.stringify(photos)); return true; }
    catch (e) { if (prev) photos[p.id] = prev; else delete photos[p.id]; return false; }
  }

  /* =============================== helpers =============================== */
  function name(p) { return p[lang] || p.en; }
  function unitLabel(unit) { return unit === 'kg' ? t.kg : unit === '250g' ? t.gram250 : unit; }

  function qtyLabel(p, qty) {
    var grams = p.unit === 'kg' ? qty * 1000 : qty * 250;
    if (grams < 1000) return grams + ' ' + t.g;
    return fmt(grams / 1000) + ' ' + t.kg;
  }
  function qtyLabelHi(p, qty) {
    var grams = p.unit === 'kg' ? qty * 1000 : qty * 250;
    if (grams < 1000) return grams + ' ग्राम';
    return fmt(grams / 1000) + ' किलो';
  }

  function fmt(n) { return (Math.round(n * 100) / 100).toString(); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function fill(str, vals) {
    return String(str).replace(/\{(\w+)\}/g, function (_, k) {
      return vals[k] === undefined ? '' : vals[k];
    });
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function formatDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    var loc = { hi:'hi-IN', en:'en-IN', bn:'bn-IN', pa:'pa-IN', te:'te-IN' }[lang] || 'hi-IN';
    try { return d.toLocaleDateString(loc, { day:'numeric', month:'short' }); }
    catch (e) { return iso; }
  }
  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode */ }
  }

  /* ===================== UPI · feedback · complaints ===================== */
  var CMP_KEY = null;

  function paintSupport(t) {
    /* --- UPI --- */
    var upi = (store.upiId || '').trim();
    el.upiBox.hidden = !upi;
    if (upi) {
      el.upiTtl.textContent   = t.upiTtl;
      el.upiIdTxt.textContent = upi;
      el.upiCopy.textContent  = t.upiCopy;
      el.upiNote.textContent  = t.upiNote;
      /* no amount is pre-filled: money changes hands at the door, and the
         customer types whatever the final bill came to. */
      el.upiPayBtn.textContent = t.upiTtl;
      el.upiPayBtn.setAttribute('href', upiLink(0));
    }
    /* --- help --- */
    el.ttlHelp.textContent      = t.ttlHelp;
    el.helpLead.textContent     = t.helpLead;
    el.btnFeedback.textContent  = t.btnFeedback;
    el.btnComplaint.textContent = t.btnComplaint;
    el.polTtl.textContent       = t.polTtl;
    el.pol1.textContent = (t.pol1 || '').replace('{h}', store.reportHours || 24);
    el.pol2.textContent = t.pol2;
    el.pol3.textContent = t.pol3;
    el.pol4.textContent = t.pol4;

    /* --- dialogs --- */
    el.fbTtl.textContent  = t.fbTtl;
    el.fbLead.textContent = t.fbLead;
    el.fbText.placeholder = t.fbPh;
    el.fbSend.querySelector('span').textContent = t.fbSend;
    drawStarPicker();

    el.cmpTtl.textContent  = t.cmpTtl;
    el.cmpLead.textContent = (t.pol1 || '').replace('{h}', store.reportHours || 24);
    el.cmpText.placeholder = t.cmpPh;
    el.cmpSend.querySelector('span').textContent = t.cmpSend;
    buildOpts(el.cmpOpts, [
      { k:t.cmp1 }, { k:t.cmp2 }, { k:t.cmp3 },
      { k:t.cmp4 }, { k:t.cmp5 }, { k:t.cmp6 }
    ].map(function (o) { return { k:o.k, label:o.k }; }),
      function (k) { CMP_KEY = k; }, CMP_KEY);
  }

  function buildOpts(host, items, onPick, current) {
    host.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      b.setAttribute('aria-pressed', String(it.k === current));
      if (it.em) { var e = document.createElement('span'); e.className = 'em'; e.textContent = it.em; b.appendChild(e); }
      var sp = document.createElement('span'); sp.textContent = it.label; b.appendChild(sp);
      b.addEventListener('click', function () {
        onPick(it.k);
        [].forEach.call(host.children, function (c) { c.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
      });
      host.appendChild(b);
    });
  }

  /* copy UPI id */
  el.upiCopy.addEventListener('click', function () {
    var t = T[lang] || T.hi, id = (store.upiId || '').trim();
    var done = function () {
      var old = el.upiCopy.textContent;
      el.upiCopy.textContent = t.upiCopied;
      setTimeout(function () { el.upiCopy.textContent = old; }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(id).then(done, done);
    else {
      var ta = document.createElement('textarea');
      ta.value = id; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
  });

  /* UPI deep link, added into the order sheet when a total exists */
  function upiLink(amount) {
    var q = 'pa=' + encodeURIComponent(store.upiId) +
            '&pn=' + encodeURIComponent(store.upiName || store.name) +
            '&cu=INR';
    if (amount > 0) q += '&am=' + encodeURIComponent(fmt(amount));
    return 'upi://pay?' + q;
  }

  /* dialogs */
  function openDlg(d) { d.hidden = false; el.scrim.hidden = false; }
  function closeDlg(d) { d.hidden = true; if (el.sheet.hidden) el.scrim.hidden = true; }
  el.openFb.addEventListener('click', function () { resetFb(); openDlg(el.fbDlg); });

  /* Put the dialog back to its asking state. Without this, reopening after a
     submit would keep the thank-you and stack another "tell Tarun" button. */
  function resetFb() {
    myStars = 0;
    el.fbText.value = '';
    el.fbHp.value = '';
    el.fbStars.hidden = false;
    el.fbText.hidden = false;
    el.fbSend.hidden = false;
    el.fbSend.disabled = false;
    el.fbDone.hidden = true;
    var extra = el.fbDlg.querySelector('.btn-ghost');
    if (extra) extra.remove();
    el.fbLead.textContent = t.fbLead;
    drawStarPicker();
  }
  el.openCmp.addEventListener('click', function () { openDlg(el.cmpDlg); });
  el.fbClose.addEventListener('click', function () { closeDlg(el.fbDlg); });
  el.cmpClose.addEventListener('click', function () { closeDlg(el.cmpDlg); });

  /* tapping the dim area, or Escape, closes whichever dialog is open */
  el.scrim.addEventListener('click', function () {
    if (!el.fbDlg.hidden) closeDlg(el.fbDlg);
    if (!el.cmpDlg.hidden) closeDlg(el.cmpDlg);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (!el.fbDlg.hidden) closeDlg(el.fbDlg);
    if (!el.cmpDlg.hidden) closeDlg(el.cmpDlg);
  });

  function whoLine() {
    var t = T[lang] || T.hi, bits = [];
    var n = (el.fName.value || '').trim(), f = (el.fFlat.value || '').trim();
    if (n) bits.push(n);
    if (f) bits.push(t.mFrom + ' ' + f);
    return bits.join(', ');
  }

  el.cmpSend.addEventListener('click', function () {
    var t = T[lang] || T.hi;
    var msg = ['*' + store.name + '* — ' + t.mCmp, ''];
    if (CMP_KEY) msg.push(t.mIssue + ': ' + CMP_KEY);
    var extra = (el.cmpText.value || '').trim();
    if (extra) msg.push(t.mDetail + ': ' + extra);
    var who = whoLine(); if (who) msg.push(who);
    openWA(msg);
    closeDlg(el.cmpDlg);
  });


  /* copy the last order text — the safety net when WhatsApp drops it */
  el.copyBtn.addEventListener('click', function () {
    var done = function () {
      var old = el.copyBtn.textContent;
      el.copyBtn.textContent = t.copyDone;
      setTimeout(function () { el.copyBtn.textContent = t.copyBtn; }, 1800);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(lastMsg).then(done, fallbackCopy);
    else fallbackCopy();
    function fallbackCopy() {
      var ta = document.createElement('textarea');
      ta.value = lastMsg;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, 999999);
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
  });


  /* ====================== ratings ====================== */
  var STAR_KEY = 'gavs.rated.v1';
  var myStars = 0;

  function apiBase() { return (store.reviewsApi || '').replace(/\/+$/, ''); }

  function starSvg(on) {
    return '<svg aria-hidden="true"' + (on ? '' : ' class="off"') +
           '><use href="#i-star"></use></svg>';
  }
  function starRow(n) {
    var out = '';
    for (var i = 1; i <= 5; i++) out += starSvg(i <= Math.round(n));
    return out;
  }

  /* the 1-5 picker inside the dialog */
  function drawStarPicker() {
    var host = el.fbStars;
    host.innerHTML = '';
    host.setAttribute('aria-label', t.fbTtl);
    for (var i = 1; i <= 5; i++) {
      (function (n) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', String(myStars === n));
        b.setAttribute('aria-label', n + '');
        b.innerHTML = starSvg(false);
        b.addEventListener('click', function () { myStars = n; paintPicker(); });
        host.appendChild(b);
      })(i);
    }
    paintPicker();
  }
  function paintPicker() {
    [].forEach.call(el.fbStars.children, function (b, i) {
      b.classList.toggle('lit', i < myStars);
      b.setAttribute('aria-checked', String(i + 1 === myStars));
    });
  }

  function loadReviews() {
    if (!apiBase()) return;
    fetch(apiBase() + '/reviews', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok) paintReviews(d); })
      .catch(function () { /* API down: section simply stays hidden */ });
  }

  var reviewData = null;
  function paintReviews(d) {
    reviewData = d;
    if (!d || !d.count) { el.revSection.hidden = true; return; }
    el.revSection.hidden = false;
    el.ttlReviews.textContent = t.ttlReviews;
    el.revAvg.textContent = d.avg.toFixed(1);
    el.revStars.innerHTML = starRow(d.avg);
    el.revCount.textContent = fill(t.revCount, { n: d.count });

    /* featured first, then recent ones we have not already shown */
    var seen = {}, rows = [];
    (d.featured || []).forEach(function (r) { seen[r.id] = 1; rows.push([r, true]); });
    (d.recent || []).forEach(function (r) { if (!seen[r.id]) rows.push([r, false]); });

    el.revList.innerHTML = '';
    rows.slice(0, 8).forEach(function (pair) {
      var r = pair[0], feat = pair[1];
      var box = document.createElement('div');
      box.className = 'rev' + (feat ? ' feat' : '');
      var top = document.createElement('div');
      top.className = 'rev-top';
      top.innerHTML = '<span class="stars">' + starRow(r.stars) + '</span>';
      if (r.name) {
        var who = document.createElement('span');
        who.className = 'rev-who'; who.textContent = r.name; top.appendChild(who);
      }
      if (r.flat) {
        var fl = document.createElement('span');
        fl.className = 'rev-flat'; fl.textContent = r.flat; top.appendChild(fl);
      }
      box.appendChild(top);
      if (r.text) {
        var tx = document.createElement('p');
        tx.className = 'rev-txt'; tx.textContent = r.text;
        box.appendChild(tx);
      }
      el.revList.appendChild(box);
    });
  }

  /* submit: post publicly, then offer to message Tarun as well */
  el.fbSend.addEventListener('click', function () {
    if (!myStars) { el.fbLead.textContent = t.fbNeedStar; return; }

    var payload = {
      stars: myStars,
      text: (el.fbText.value || '').trim(),
      name: (el.fName.value || '').trim(),
      flat: (el.fFlat.value || '').trim(),
      website: el.fbHp.value          /* honeypot */
    };

    var toWhatsApp = function () {
      var msg = ['*' + store.name + '* — ' + t.mFb, '', t.mRating + ': ' + myStars + '/5'];
      if (payload.text) msg.push(t.mDetail + ': ' + payload.text);
      var who = whoLine(); if (who) msg.push(who);
      openWA(msg);
    };

    if (!apiBase()) { toWhatsApp(); closeDlg(el.fbDlg); return; }

    el.fbSend.disabled = true;
    fetch(apiBase() + '/reviews', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
      .then(function (res) {
        el.fbSend.disabled = false;
        if (res.s === 429) { el.fbLead.textContent = t.fbTooSoon; return; }
        if (!res.d || !res.d.ok) { el.fbLead.textContent = t.fbFail; return; }

        try { localStorage.setItem(STAR_KEY, String(myStars)); } catch (e) {}
        el.fbStars.hidden = true;
        el.fbText.hidden = true;
        el.fbSend.hidden = true;
        el.fbDone.hidden = false;
        el.fbDone.textContent = t.fbThanks;
        loadReviews();

        var also = document.createElement('button');
        also.className = 'btn btn-ghost';
        also.type = 'button';
        also.style.marginTop = '12px';
        also.textContent = t.fbTellT;
        also.addEventListener('click', function () { toWhatsApp(); closeDlg(el.fbDlg); });
        el.fbDone.parentNode.appendChild(also);
      })
      .catch(function () {
        el.fbSend.disabled = false;
        el.fbLead.textContent = t.fbFail;
      });
  });

  loadReviews();

})();
</script>
</body>
</html>
